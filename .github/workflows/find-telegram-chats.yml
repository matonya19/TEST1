name: Find Telegram chats

# Показывает ID чатов и групп, где есть бот. Запускается вручную.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  chats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-stats-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: List chats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m bot.telegram | tee -a "$GITHUB_STEP_SUMMARY"
