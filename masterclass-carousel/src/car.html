<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../build/node_modules/@fontsource/manrope/800.css">
<link rel="stylesheet" href="../build/node_modules/@fontsource/manrope/600.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;font-family:Manrope,sans-serif;color:#1B2440}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;margin-bottom:20px;color:#fff;background:radial-gradient(700px 600px at 100% 0%,rgba(120,200,255,.55),transparent 70%),radial-gradient(700px 600px at 0% 100%,rgba(60,40,200,.45),transparent 70%),linear-gradient(160deg,#2B8BEE 0%,#1F5FD6 55%,#1B3FA8 100%)}
.card,.q{color:#1B2440}
.blob{position:absolute;border-radius:50%}
.in{position:absolute;inset:0;padding:56px 64px 110px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;flex:none}
.top img{height:84px;background:#fff;padding:12px 20px;border-radius:24px;box-shadow:0 8px 22px rgba(10,30,90,.25)}
.tag{font-weight:800;font-size:22px;letter-spacing:2px;background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.5);padding:10px 22px;border-radius:30px}
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:26px;color:#fff}
.foot .n{opacity:.7}.foot .a{background:rgba(255,255,255,.2);color:#fff;border-radius:30px;padding:8px 22px;font-size:24px}
h1{font-weight:800;letter-spacing:-2px;line-height:1.04}
h1 span:last-child{color:#FFD23F}
h2{font-weight:800;font-size:62px;line-height:1.06;letter-spacing:-1.5px;margin:28px 0 24px;text-wrap:balance}
p{font-weight:600;font-size:38px;line-height:1.3;text-wrap:pretty}
.card{background:#fff;border-radius:36px;padding:30px 32px 30px;box-shadow:0 10px 30px rgba(27,36,64,.08);display:flex;flex-direction:column;flex:1;min-height:0;margin-bottom:22px;border-left:14px solid #FFD23F}
.row{display:flex;gap:26px}
.card:nth-of-type(even){border-left-color:#1E96EA}
.ic{flex:none;width:124px;height:124px;border-radius:34px;background:#FFF1C2;display:flex;align-items:center;justify-content:center;font-family:"Noto Color Emoji";font-size:70px}
.card:nth-of-type(even) .ic{background:#E1F1FF}
.ph{flex:none;width:180px;height:180px;position:relative}.ph img{width:180px;height:180px;border-radius:42px;object-fit:cover;border:6px solid #FFD23F;box-shadow:0 8px 20px rgba(27,36,64,.18)}.card:nth-of-type(even) .ph img{border-color:#1E96EA}.ph span{position:absolute;right:-12px;bottom:-10px;width:62px;height:62px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Color Emoji";font-size:34px;box-shadow:0 4px 12px rgba(27,36,64,.2)}
.ph.il img{border:none}
.big .ph,.big .ph img{width:250px;height:250px}.big .ph span{width:80px;height:80px;font-size:44px}
.cb{flex:1;display:flex;flex-direction:column;min-width:0}
.ct{font-weight:800;font-size:47px;line-height:1.1;letter-spacing:-.5px;text-wrap:balance}
.cn{font-weight:800;font-size:35px;color:#1E96EA;margin-top:10px}
.cd{font-weight:600;font-size:35px;line-height:1.26;margin-top:14px;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:14px}
.chip{font-weight:800;font-size:30px;padding:11px 24px;border-radius:26px;background:#1B2440;color:#fff}
.chip.g{background:#EEF1F7;color:#1B2440}
.em{position:absolute;font-family:"Noto Color Emoji";display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;box-shadow:0 12px 30px rgba(27,36,64,.14)}
.big .ct{font-size:54px}.big .cn{font-size:42px;margin-top:14px}.big .cd{font-size:40px;margin-top:18px}.big .chip{font-size:30px;padding:13px 26px}.big .ic{width:150px;height:150px;font-size:86px}.big .card{padding:44px 40px;flex:none}.big .chips{padding-top:34px;margin-top:0}.big .row{gap:36px}

.btnline{display:inline-block;background:#FFD23F;color:#1B2440;font-weight:800;font-size:36px;padding:22px 40px;border-radius:50px;align-self:flex-start}
</style></head><body><div id="root"></div>
<script>
const MK=[
 ['Нарисуем робота и узнаем секреты погоды',[
  ['🤖','«Рисуем робота»','Ксения Позднякова','Придумаем своего робота и нарисуем его с помощью простого и цветных карандашей',['16 ноября · 14:00 МСК'],'Для 1–4 классов'],
  ['🌪','«Атмосферные вихри»','Матвей Кривошапко','Узнаем, какими бывают торнадо, и познакомимся с удивительными явлениями погоды',['16 ноября · 16:00 МСК'],'Для 5–8 классов']]],
 ['Попробуем творить вместе с нейросетями',[
  ['💻','«Просто о сложном: вайбкодинг»','Владимир Голышев','Обсудим, как ИИ помогает воплощать идеи, и попробуем поэкспериментировать',['17 ноября · 14:00 МСК'],'Для 5–11 классов'],
  ['🎨','«Когда картины оживают»','Виктория Голышева','Нарисуем свою «Звёздную ночь» и узнаем, как оживить рисунок с помощью нейросети',['17 ноября · 15:00 МСК'],'Для 1–11 классов']]],
 ['Придумаем историю и освоим рыболовные узлы',[
  ['📖','«Как написать свою первую книгу»','Мария Смирнова','Обсудим, с чего начать, где искать вдохновение и как превратить идею в историю',['18 ноября · 14:00 МСК'],'Для 5–11 классов'],
  ['🎣','«Секреты успешной рыбалки»','Дамир Ерёмин','Познакомимся с основами рыбалки и попробуем самостоятельно завязать рыболовные узлы',['19 ноября · 14:00 МСК'],'Для 1–4 классов']]],
 ['Разберёмся, как работают сердце и ИИ',[
  ['❤️','«Сердце и кровеносная система»','Виктория Юрченко','Узнаем, как работает сердце, и потренируемся измерять пульс',['20 ноября · 14:00 МСК'],'Для 5–11 классов'],
  ['🤖','«ИИ: просто, интересно, для себя»','Полина Зайцева','Познакомимся с искусственным интеллектом и обсудим вопросы о нём простыми словами',['20 ноября · 15:00 МСК'],'Для 3–8 классов']]],
 ['Поиграем в команде и попробуем себя на сцене',[
  ['🎮','«Основы игры Dandy’s World»','Василиса Лукащук','Разберём персонажей, правила и управление. Попробуем пройти первые этажи вместе',[],'Для ребят 8–12 лет с опытом игр в Roblox'],
  ['🎭','«Театральное искусство»','Эвита Ильина','Поработаем над выразительной речью, попробуем передавать эмоции и разыграем мини-сценки',[],'Для 1–11 классов']]],
 ['Создадим открытку и рамку для любимых фотографий',[
  ['🎄','«Новогодняя открытка в Canva»','Есения Масина','Создадим свою открытку, которую можно сохранить или отправить близким',['24 ноября · 15:00 МСК'],'Для 5–11 классов'],
  ['🍓','«Клубничная фоторамка своими руками»','Таисия Сапрыкина','Сделаем необычную фоторамку для своей комнаты или в подарок',['24 ноября · 16:00 МСК'],'Для 1–11 классов']]],
 ['Смастерим подарок и оживим бумажных героев',[
  ['🎁','«Новогодний подарок»','Ирем Мехтиева','Подготовим бумагу, карандаши и ножницы — будем делать подарок своими руками',['25 ноября · 16:00 МСК'],'Для 1–11 классов'],
  ['🎬','«Оживляем бумажных героев для съёмки видео»','Захар Богданов','Создадим бумажных персонажей и узнаем, как оживить их для видео',['26 ноября · 14:00 МСК'],'Для 1–4 классов']]],
 ['Создадим свою анимацию и первую программу',[
  ['🎞','«Анимация: создаём свои мультики»','Лев Толмачев','Попробуем оживить персонажей в приложении «Рисуем мультики 2». Подойдёт начинающим',['27 ноября · 15:00 МСК'],'Для 5–11 классов'],
  ['🐍','«Первая программа на Python»','Артём Пелых','Познакомимся с основами программирования и попробуем написать простую программу',['30 ноября · 16:00 МСК'],'Для 4–11 классов, от 9 лет']]],
 ['А ещё — нарисуем свой пейзаж',[
  ['🌿','«Учимся живописи: пейзажи гуашью»','Аида Высоткова','Возьмём краски и попробуем создать пейзаж со своими цветами и настроением',['Дату и время сообщим дополнительно'],'Для 3–6 классов']]],
];
const AV={'Владимир Голышев':'av_golyshev.png','Виктория Голышева':'av_golysheva.png','Эвита Ильина':'av_ilyina.png','Таисия Сапрыкина':'av_saprykina.png','Лев Толмачев':'av_tolmachev.png'};
const IL={'Ксения Позднякова':'robot','Матвей Кривошапко':'tornado','Мария Смирнова':'book','Дамир Ерёмин':'fishing','Виктория Юрченко':'heart','Полина Зайцева':'ai','Василиса Лукащук':'game','Есения Масина':'card','Ирем Мехтиева':'gift','Захар Богданов':'paper','Артём Пелых':'python','Аида Высоткова':'gouache'};
const N=12, root=document.getElementById('root');
const blobs=i=>'';
const shell=(i,tag,body,arrow=true,cls='')=>`<div class="s ${arrow===true||arrow===false?'':''}${typeof arrow==='string'?arrow:cls}" id="s${i}">${blobs(i)}<div class="in"><div class="top"><img src="logo.png"><div class="tag">${tag}</div></div><div class="content">${body}</div></div>
 <div class="foot"><span class="n">${i} / ${N}</span>${arrow!==false?'<span class="a">листайте →</span>':'<span></span>'}</div></div>`;
let h='';
h+=shell(1,'КОНКУРС МАСТЕР-КЛАССОВ',`
 <h1 style="font-size:132px;margin-top:56px"><span>А сегодня</span><br><span>учитель — я!</span></h1>
 <p style="margin-top:34px;font-size:44px;max-width:780px">Рисовать, создавать мультики, программировать и даже писать книги…</p>
 <div style="flex:1;position:relative">
  ${[['robot',175,0,20,-6],['starry',155,195,75,5],['theater',175,370,10,-4],['python',155,565,70,6],['anim',165,740,20,4]].map(([e,z,l,t,r])=>`<img src="il_${e}.jpg" style="position:absolute;width:${z}px;height:${z}px;left:${l}px;top:${t}px;border-radius:40px;transform:rotate(${r}deg);box-shadow:0 14px 30px rgba(27,36,64,.18);border:6px solid #fff">`).join('')}
 </div>
 <p style="font-weight:800;font-size:46px;line-height:1.18">Ученики SHKOLA проведут свои мастер-классы</p>
 <div class="btnline" style="margin-top:26px">Выбирайте, на какой прийти →</div>`,false);
h+=shell(2,'О КОНКУРСЕ',`
 <h1 style="font-size:104px;margin-top:80px"><span>«Я умею —</span><br><span>и тебя научу!»</span></h1>
 <p style="margin-top:56px;font-size:44px">В SHKOLA запускается <b style="font-weight:800">второй конкурс</b>, в рамках которого ученики становятся ведущими мастер-классов</p>
 <p style="margin-top:34px;font-size:44px">Ребята поделятся своими увлечениями, объяснят, покажут и предложат попробовать вместе</p>
 <div style="flex:1;position:relative">${[['book',165,0,40,-5],['fishing',150,190,80,4],['heart',165,360,30,-3],['game',150,550,85,5],['gift',160,735,35,-4]].map(([e,z,l,t,r])=>`<img src="il_${e}.jpg" style="position:absolute;width:${z}px;height:${z}px;left:${l}px;top:${t}px;border-radius:40px;transform:rotate(${r}deg);box-shadow:0 14px 30px rgba(10,30,90,.3);border:6px solid #fff">`).join('')}</div><div class="btnline">Знакомьтесь с ведущими →</div>`,false);
MK.forEach(([title,cards],k)=>{const i=k+3;
 h+=shell(i,'МАСТЕР-КЛАССЫ',`<h2>${title}</h2>`+cards.map(([e,t,n,d,dates,gr])=>`<div class="card"><div class="row">${AV[n]?`<div class="ph"><img src="${AV[n]}"><span>${e}</span></div>`:`<div class="ph il"><img src="il_${IL[n]}.jpg"></div>`}<div class="cb"><div class="ct">${t}</div><div class="cn">${n}</div><div class="cd">${d}</div></div></div><div class="chips">${dates.map(x=>`<span class="chip">${x}</span>`).join('')}<span class="chip g">${gr}</span></div></div>`).join('')+(cards.length<2?`<div style="flex:1;position:relative">${[['🎨',150,110,10],['🖌',120,340,50],['🌄',150,545,0],['🌻',115,780,45]].map(([e,z,l,t])=>`<div class="em" style="width:${z}px;height:${z}px;font-size:${z*.55}px;left:${l}px;top:${t}px">${e}</div>`).join('')}</div>`:''),cards.length<2?'big':(i===10?'tight':''));});
h+=shell(12,'ВЫБИРАЙТЕ',`
 <h1 style="font-size:92px;margin-top:80px;white-space:nowrap"><span>Какой мастер-класс</span><br><span>выберет ваш</span><br><span>ребёнок?</span></h1>
 <p style="margin-top:50px;font-size:44px">Покажите ему программу — здесь можно найти занятие по своему увлечению или попробовать что-то впервые</p>
 <div style="flex:1"></div>
 <div style="background:#fff;color:#1B2440;border-radius:40px;padding:36px 40px"><p style="font-weight:800;font-size:46px;color:#1B2440">Сохраните расписание</p><p style="font-size:38px;margin-top:12px;color:#1B2440">И напишите в комментариях, какой мастер-класс заинтересовал больше всего <span style="font-family:'Noto Color Emoji'">💙</span></p></div>`,false);
root.innerHTML=h;
</script></body></html>
