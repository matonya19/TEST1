<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../build/node_modules/@fontsource/manrope/800.css">

<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas><img id="logo" src="logo.png" style="display:none">
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920,END=57.3;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),prog=(t,s,d)=>clamp((t-s)/d),ease=p=>1-Math.pow(1-p,3),back=(p,s=2)=>1+(s+1)*Math.pow(p-1,3)+s*Math.pow(p-1,2);

function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
const O=0;
const SUBS=[[0.33,2.2,'Привет! Я Вика'],[2.3,4.9,'Добро пожаловать в мой мир творчества!'],[4.97,8.0,'А что, если твой рисунок сможет ожить?'],
[10.37,13.4,'На моём мастер-классе мы нарисуем свою «Звёздную ночь»'],[13.4,16.3,'по мотивам картины Ван Гога'],
[18.37,23.5,'Закрутим небо в синие вихри, зажжём звёзды и добавим чёрного кота'],
[25.29,30.2,'Я покажу всё по шагам: будем смешивать краски, пробовать и придумывать своё'],
[30.25,37.7,'А потом самое интересное: я покажу, как превратить рисунок в анимацию'],[37.77,39.3,'Готовься увидеть волшебство'],

function wrap(s,maxW){const ws=s.split(' '),ls=[];let l='';for(const w of ws){const t=l?l+' '+w:w;if(x.measureText(t).width>maxW&&l){ls.push(l);l=w;}else l=t;}ls.push(l);return ls;}
function draw(t){

  if(t<END+.5){

    let p=ease(prog(t,.4,.6));

      ls.forEach((l,i)=>{x.fillStyle=(s==='Готовься увидеть волшебство'||s.startsWith('Приходи'))?'#1E5FD6':'#1B2440';x.fillText(l,0,(i-(ls.length-1)/2)*lh);});x.restore(); }
    // date plate
    p=ease(prog(t,1.2,.7));
    if(p>0){x.save();x.globalAlpha=p;x.translate(0,(1-p)*40);rr(110,1492,860,104,52);x.fillStyle='#fff';x.fill();
      x.fillStyle='#1B2440';x.font=F(800,40);x.fillText('17 ноября · 15:00 МСК · 1–11 классы',540,1546);x.restore();}
  }
  // end card
  const lt=t-END; if(lt>=0){ const a=ease(clamp(lt/.4));
    x.save();x.globalAlpha=a;let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#FFE066');g.addColorStop(.5,'#FFD23F');g.addColorStop(1,'#FFBE2E');x.fillStyle=g;x.fillRect(0,0,W,H);
    const lg=document.getElementById('logo'),lw=300,lh=lw*lg.naturalHeight/lg.naturalWidth;x.drawImage(lg,540-lw/2,330,lw,lh);x.restore();
    let p=ease(prog(lt,.15,.5));x.save();x.globalAlpha=p;x.translate(0,(1-p)*30);x.fillStyle='#1B2440';x.font=F(800,104);x.fillText('Приходи',540,620);x.fillText('на мастер-класс!',540,740);
    x.font=F(800,64);x.fillStyle='#1E5FD6';x.fillText('«Когда картины',540,900);x.fillText('оживают»',540,978);x.restore();
    p=prog(lt,.6,.6); if(p>0){const s=back(p);x.save();x.translate(540,1170);x.scale(s,s);x.rotate(-.02);x.shadowColor='rgba(8,20,70,.35)';x.shadowBlur=40;x.shadowOffsetY=14;
      rr(-430,-120,860,240,44);x.fillStyle='#fff';x.fill();x.shadowColor='transparent';x.fillStyle='#1B2440';x.font=F(800,66);x.fillText('17 ноября · 15:00 МСК',0,-36);
      x.font=F(600,40);x.fillText('онлайн · для 1–11 классов',0,50);x.restore();}
    p=ease(prog(lt,1.0,.5));x.save();x.globalAlpha=p;x.font=F(600,40);x.fillStyle='#1B2440';x.fillText('Ведущая — Виктория Голышева, ученица SHKOLA',540,1380);
    const cw=760;rr(540-cw/2,1450,cw,92,46);x.fillStyle='#1B2440';x.fill();x.fillStyle='#fff';x.font=F(800,36);x.fillText('Как подключиться — в описании',540,1498);x.restore();
  }
}
window.drawAt=draw;window.ready=Promise.all([document.fonts.load(F(800,40),'Привет ChatGPT 0123456789·«»—'),document.fonts.load(F(600,40),'онлайн 0123456789'),document.getElementById('logo').decode()]).then(()=>true);
</script></body></html>
