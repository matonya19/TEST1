<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../build/node_modules/@fontsource/manrope/800.css">
<link rel="stylesheet" href="../build/node_modules/@fontsource/manrope/600.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;font-family:Manrope,sans-serif}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;color:#fff;background:radial-gradient(800px 700px at 100% 0%,rgba(120,200,255,.55),transparent 70%),radial-gradient(800px 700px at 0% 100%,rgba(60,40,200,.45),transparent 70%),linear-gradient(165deg,#2B8BEE 0%,#1F5FD6 55%,#1B3FA8 100%)}
.logo{position:absolute;top:130px;left:50%;transform:translateX(-50%);height:80px}
.in{position:absolute;inset:0;padding:270px 64px 330px;display:flex;flex-direction:column;align-items:center;text-align:center}
.live{font-weight:800;font-size:38px;letter-spacing:3px;padding:16px 38px;border-radius:50px;background:#E5322D;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.25)}
h1{font-weight:800;font-size:104px;line-height:1.02;letter-spacing:-3px;margin-top:34px}
h1 em{font-style:normal;color:#FFD23F}
.pic{margin:34px 0 30px;width:640px;height:640px;flex:none;border-radius:64px;overflow:hidden;border:10px solid #fff;box-shadow:0 26px 60px rgba(8,20,70,.35);transform:rotate(-3deg)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.t{font-weight:800;font-size:52px;line-height:1.12}
.who{font-weight:600;font-size:42px;margin-top:14px;white-space:nowrap}
.row{display:flex;gap:18px;margin-top:30px}
.chip{font-weight:800;font-size:44px;background:#fff;color:#1B2440;padding:20px 38px;border-radius:50px;box-shadow:0 12px 30px rgba(8,20,70,.25)}
.chip.y{background:#FFD23F}
</style></head><body>
<div class="s" id="s"><img class="logo" src="logo_teal.png"><div class="in">
 <div class="live">20 НОЯБРЯ · 14:00 МСК</div>
 <h1>Сердце и<br><em>кровеносная система</em></h1>
 <div class="pic"><img src="heart.png"></div>
 <div class="t">Научимся измерять пульс</div>
 <div class="who">Ведущая — Виктория Юрченко, 7 класс</div>
 <div class="row"><span class="chip y">5–11 классы</span></div>
</div></div></body></html>
