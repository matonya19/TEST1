<style>
  /* Layout: the child's drawing, one orange marker frame on sketchbook paper; play field on top, white button box bottom-left */
  :root {
    --paper: #ecebe7;
    --sheet: #fbfbf9;
    --marker: #ec5a24;
    --marker-dark: #c9430f;
    --brown: #3b2018;
    --ink: #4a2a1e;
    --hand: "Neucha", "Comic Sans MS", "Marker Felt", cursive;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--hand);
    display: grid;
    place-items: center;
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .frame {
    width: min(560px, 100%);
    box-sizing: border-box;
    padding: clamp(14px, 4vw, 26px);
    display: grid;
    gap: clamp(12px, 3vw, 20px);
    background-color: var(--marker);
    background-image:
      repeating-linear-gradient(104deg, rgba(255, 150, 90, .18) 0 3px, transparent 3px 11px),
      repeating-linear-gradient(77deg, rgba(150, 35, 0, .12) 0 2px, transparent 2px 9px);
    border-radius: 7px 16px 9px 13px / 13px 7px 15px 9px;
    box-shadow: -4px 3px 0 rgba(80, 32, 14, .55), 0 14px 30px rgba(60, 30, 10, .15);
    transform: rotate(-.7deg);
  }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 600 / 420;
    max-width: 100%;
    background: var(--sheet);
    border-radius: 3px 10px 0 0;
    touch-action: manipulation;
    cursor: pointer;
  }
  .controls {
    display: grid;
    grid-template-columns: 52% 1fr;
  }
  .panel {
    background: var(--sheet);
    border-radius: 2px 8px 4px 3px;
    display: flex;
    justify-content: center;
    gap: clamp(14px, 5vw, 30px);
    padding: clamp(12px, 3vw, 18px) 10px clamp(10px, 2.5vw, 14px);
  }
  .btn {
    appearance: none;
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    color: var(--marker);
    display: grid;
    justify-items: center;
    gap: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .key {
    width: clamp(52px, 15vw, 74px);
    aspect-ratio: 1;
    box-sizing: border-box;
    border: clamp(5px, 1.4vw, 7px) solid var(--marker);
    border-radius: 9px 6px 10px 5px;
    background: var(--sheet);
    display: grid;
    place-items: center;
    transition: transform .08s ease-out, background-color .08s;
  }
  .key svg { width: 46%; height: 46%; }
  .dash {
    width: 78%;
    height: clamp(5px, 1.3vw, 7px);
    background: var(--marker);
    border-radius: 4px;
  }
  .label { font-size: clamp(15px, 4vw, 19px); line-height: 1; }
  .btn.down .key, .btn:active .key { transform: translateY(3px) scale(.94); background: #ffe3d6; }
  .btn:focus-visible { outline: 3px dashed var(--brown); outline-offset: 4px; border-radius: 8px; }
  .hint {
    margin: 18px 0 0;
    text-align: center;
    font-size: 17px;
    color: #7b5a4c;
  }
  .hint kbd { font-family: inherit; border: 2px solid #c9b8ae; border-radius: 5px; padding: 0 6px; }
  @media (hover: none) { .hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { .key { transition: none; } }
</style>

<div>
  <main class="frame">
    <canvas id="game" aria-label="Игровое поле: чудик прыгает через треугольники"></canvas>
    <div class="controls">
      <div class="panel">
        <button class="btn" id="jump" type="button" aria-label="Прыжок">
          <span class="key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></span>
          <span class="dash"></span>
          <span class="label">прыг</span>
        </button>
        <button class="btn" id="bigjump" type="button" aria-label="Большой прыжок">
          <span class="key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l7-7 7 7M5 20l7-7 7 7"/></svg></span>
          <span class="dash"></span>
          <span class="label">ПРЫГ!</span>
        </button>
      </div>
    </div>
  </main>
  <p class="hint"><kbd>пробел</kbd> прыг · <kbd>Enter</kbd> большой ПРЫГ</p>
</div>

<script>
(() => {
  const W = 600, H = 420, GROUND = 330;
  const ORANGE = "#ec5a24", BROWN = "#3b2018", SHEET = "#fbfbf9";
  const GRAVITY = 2300, JUMP_V = 780, BIG_V = 1010;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let scale = 1;

  // Marker-scribble texture for the ground and spikes
  function makeScribble(base, light, dark) {
    const c = document.createElement("canvas");
    c.width = c.height = 96;
    const g = c.getContext("2d");
    g.fillStyle = base; g.fillRect(0, 0, 96, 96);
    g.lineCap = "round";
    for (let i = 0; i < 70; i++) {
      g.strokeStyle = Math.random() < .5 ? light : dark;
      g.globalAlpha = .25 + Math.random() * .35;
      g.lineWidth = 1 + Math.random() * 3;
      const x = Math.random() * 96, y = Math.random() * 96, len = 14 + Math.random() * 40;
      const a = -1.2 + Math.random() * .5;
      for (const dx of [-96, 0, 96]) for (const dy of [-96, 0, 96]) {
        g.beginPath(); g.moveTo(x + dx, y + dy);
        g.lineTo(x + dx + Math.cos(a) * len, y + dy + Math.sin(a) * len); g.stroke();
      }
    }
    return ctx.createPattern(c, "repeat");
  }
  const orangeFill = makeScribble(ORANGE, "#ff8a52", "#cf4512");
  const brownFill = makeScribble(BROWN, "#5a3326", "#1f0f0a");

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = canvas.clientWidth;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(w * H / W * dpr);
    scale = canvas.width / W;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // Sound: a tiny square-wave blip, started only after the first press
  let audio = null;
  function beep(f1, f2, dur, type = "square", vol = .08) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  let best = 0;
  try { best = +localStorage.getItem("chudik-best") || 0; } catch (e) {}

  const hero = { x: 110, y: GROUND, vy: 0, w: 46, h: 58, onGround: true, squash: 0 };
  let state = "ready";         // ready | play | over
  let obstacles = [], dust = [];
  let speed = 0, scroll = 0, untilNext = 0, score = 0, overAt = 0, buffered = 0, buffV = 0;
  let blinkT = 2, t = 0;

  function reset() {
    obstacles = []; dust = [];
    hero.y = GROUND; hero.vy = 0; hero.onGround = true;
    score = 0; speed = 280; untilNext = 420;
  }
  reset();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawn() {
    let n = 1;
    const r = Math.random();
    if (score >= 4 && r < .3) n = 2;
    if (score >= 12 && r < .08) n = 3;
    const tris = [];
    let x = W + 20;
    for (let i = 0; i < n; i++) {
      const w = n === 3 ? rand(30, 36) : rand(36, 52);
      const h = n === 3 ? rand(30, 40) : n === 2 ? rand(40, 58) : rand(42, 74);
      tris.push({ x, w, h, j: [rand(-3, 3), rand(-3, 3), rand(-2, 2)] });
      x += w - 4;
    }
    obstacles.push({ tris, passed: false });
    untilNext = speed * rand(.85, 1.7) + 170;
  }

  function press(big) {
    if (state === "ready") { state = "play"; }
    else if (state === "over") {
      if (t - overAt < .45) return;
      reset(); state = "play";
    }
    buffered = .13; buffV = big ? BIG_V : JUMP_V;
  }

  function triHeightAt(tri, x) {
    const cx = tri.x + tri.w / 2;
    return Math.max(0, tri.h * (1 - Math.abs(x - cx) / (tri.w / 2)));
  }

  function hits() {
    const pad = 6;
    const l = hero.x - hero.w / 2 + pad, r = hero.x + hero.w / 2 - pad;
    const bottom = hero.y - 2;
    for (const o of obstacles) for (const tri of o.tris) {
      const a = Math.max(l, tri.x), b = Math.min(r, tri.x + tri.w);
      if (a >= b) continue;
      const cx = tri.x + tri.w / 2;
      const peakX = cx < a ? a : cx > b ? b : cx;
      if (bottom > GROUND - triHeightAt(tri, peakX)) return true;
    }
    return false;
  }

  function update(dt) {
    t += dt;
    blinkT -= dt;
    if (blinkT < -.12) blinkT = rand(1.8, 4.5);
    hero.squash *= Math.pow(.0005, dt);

    for (const p of dust) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
    dust = dust.filter(p => p.life > 0);

    if (state !== "play") return;

    speed = 280 + Math.min(300, score * 9);
    scroll += speed * dt;

    if (buffered > 0) {
      buffered -= dt;
      if (hero.onGround) {
        hero.vy = -buffV; hero.onGround = false; buffered = 0; hero.squash = -.25;
        buffV === BIG_V ? beep(260, 900, .22) : beep(420, 760, .14);
      }
    }
    if (!hero.onGround) {
      hero.vy += GRAVITY * dt;
      hero.y += hero.vy * dt;
      if (hero.y >= GROUND) {
        hero.y = GROUND; hero.vy = 0; hero.onGround = true; hero.squash = .28;
        for (let i = 0; i < 7; i++) dust.push({ x: hero.x + rand(-20, 20), y: GROUND - 2, vx: rand(-90, 40), vy: rand(-160, -60), life: rand(.25, .45) });
      }
    }

    untilNext -= speed * dt;
    if (untilNext <= 0) spawn();
    for (const o of obstacles) {
      for (const tri of o.tris) tri.x -= speed * dt;
      const last = o.tris[o.tris.length - 1];
      if (!o.passed && last.x + last.w < hero.x - hero.w / 2) {
        o.passed = true; score++;
        if (score % 10 === 0) beep(700, 1400, .18, "triangle", .1);
      }
    }
    obstacles = obstacles.filter(o => o.tris[o.tris.length - 1].x + 80 > 0);

    if (hits()) {
      state = "over"; overAt = t; hero.squash = .2;
      beep(220, 55, .45, "sawtooth", .07);
      if (score > best) { best = score; try { localStorage.setItem("chudik-best", best); } catch (e) {} }
    }
  }

  function drawGround() {
    ctx.save();
    ctx.translate(-(scroll % 96), 0);
    ctx.fillStyle = orangeFill;
    ctx.beginPath();
    ctx.moveTo(-10, GROUND + 3);
    for (let x = -10; x <= W + 110; x += 24) ctx.lineTo(x, GROUND + Math.sin((x + scroll - (scroll % 96)) * .05) * 2.5);
    ctx.lineTo(W + 110, H + 10); ctx.lineTo(-10, H + 10);
    ctx.fill();
    ctx.restore();
  }

  function drawSpike(tri) {
    const [a, b, c] = tri.j;
    ctx.fillStyle = orangeFill;
    ctx.beginPath();
    ctx.moveTo(tri.x + a * .5, GROUND + 4);
    ctx.lineTo(tri.x + tri.w / 2 + c, GROUND - tri.h + a);
    ctx.lineTo(tri.x + tri.w + b * .5, GROUND + 4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(190, 60, 15, .55)";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.stroke();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHero() {
    const s = hero.squash;
    const w = hero.w * (1 + s * .6), h = hero.h * (1 - s * .6);
    const tilt = hero.onGround ? 0 : Math.max(-.25, Math.min(.25, hero.vy / 3000));
    const bob = state === "play" && hero.onGround ? Math.abs(Math.sin(t * 14)) * 2 : 0;
    ctx.save();
    ctx.translate(hero.x, hero.y - bob);
    ctx.rotate(state === "over" ? .12 : tilt);

    // orange outline, then brown body
    ctx.fillStyle = ORANGE;
    roundRect(-w / 2 - 5, -h - 5, w + 10, h + 8, 7); ctx.fill();
    ctx.fillStyle = brownFill;
    roundRect(-w / 2, -h, w, h, 4); ctx.fill();

    // eyes: two orange squares, like in the drawing
    const ey = -h + 9, es = 13;
    for (const ex of [-w / 2 + 6, w / 2 - 6 - es]) {
      ctx.fillStyle = ORANGE;
      ctx.fillRect(ex - 2, ey - 2, es + 4, es + 4);
      if (state === "over") {
        ctx.strokeStyle = BROWN; ctx.lineWidth = 3; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(ex + 2, ey + 2); ctx.lineTo(ex + es - 2, ey + es - 2);
        ctx.moveTo(ex + es - 2, ey + 2); ctx.lineTo(ex + 2, ey + es - 2);
        ctx.stroke();
      } else if (blinkT < 0) {
        ctx.fillStyle = BROWN; ctx.fillRect(ex, ey + es / 2 - 1.5, es, 3);
      } else {
        ctx.fillStyle = "#ffb08a"; ctx.fillRect(ex + 1, ey + 1, es - 2, es - 2);
        ctx.fillStyle = BROWN; ctx.fillRect(ex + es - 7, ey + (hero.vy < -200 ? 2 : 4), 5, 6);
      }
    }
    ctx.restore();
  }

  function text(str, x, y, size, color, align = "center") {
    ctx.font = `${size}px Neucha, "Comic Sans MS", cursive`;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = SHEET;
    ctx.fillRect(0, 0, W, H);

    drawGround();
    for (const o of obstacles) for (const tri of o.tris) drawSpike(tri);

    ctx.fillStyle = ORANGE;
    for (const p of dust) { ctx.globalAlpha = Math.max(0, p.life * 2.5); ctx.fillRect(p.x, p.y, 5, 5); }
    ctx.globalAlpha = 1;

    drawHero();

    text(String(score), W - 26, 38, 44, ORANGE, "right");
    if (best > 0) text("рекорд " + best, W - 26, 74, 20, "#b49384", "right");

    if (state === "ready") {
      text("Нажми кнопку внизу,", W / 2 + 40, 150, 32, BROWN);
      text("и чудик прыгнет!", W / 2 + 40, 188, 32, BROWN);
    } else if (state === "over") {
      text("Ой! Треугольник!", W / 2 + 30, 140, 40, BROWN);
      text(score > 0 && score === best ? "Новый рекорд: " + score + "!" : "Прыжков: " + score, W / 2 + 30, 184, 26, ORANGE);
      if (t - overAt > .45) text("Жми кнопку, чтобы ещё раз", W / 2 + 30, 222, 22, "#8a6a5c");
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Controls: the two buttons, a tap on the field, and the keyboard
  function bindButton(id, big) {
    const el = document.getElementById(id);
    el.addEventListener("pointerdown", e => { e.preventDefault(); el.classList.add("down"); press(big); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) el.addEventListener(ev, () => el.classList.remove("down"));
    el.addEventListener("click", e => { if (e.detail === 0) press(big); }); // keyboard activation
  }
  bindButton("jump", false);
  bindButton("bigjump", true);
  canvas.addEventListener("pointerdown", e => { e.preventDefault(); press(false); });
  window.addEventListener("keydown", e => {
    if (e.repeat || e.target instanceof HTMLButtonElement) return;
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); press(false); }
    else if (e.code === "Enter") { e.preventDefault(); press(true); }
  });
})();
</script>
