<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Копилка заданий</title>
<style>
  :root {
    --bg: #fff8ec; --card: #ffffff; --text: #2b2b3a; --muted: #7a7a8c;
    --accent: #ff8a3d; --accent-2: #4caf7a; --warn: #f2b632; --danger: #e5534b;
    --border: #f0e2c8; --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1b26; --card: #2a2735; --text: #f2f0f7; --muted: #a9a5b8; --border: #3b3748; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 80px; }
  header { text-align: center; margin-bottom: 12px; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  h2 { font-size: 19px; margin: 24px 0 10px; }
  .balance {
    background: linear-gradient(135deg, #ffb347, #ff7a3d); color: #fff;
    border-radius: var(--radius); padding: 18px; text-align: center; margin: 12px 0;
  }
  .balance .sum { font-size: 40px; font-weight: 800; }
  .goal { margin-top: 10px; font-size: 15px; }
  .bar { height: 10px; background: rgba(255,255,255,.35); border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: #fff; }
  .tabs { display: flex; gap: 8px; margin: 12px 0; }
  .tabs button { flex: 1; }
  button {
    font: inherit; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer;
    background: var(--border); color: var(--text);
  }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.ok { background: var(--accent-2); color: #fff; font-weight: 600; }
  button.danger { background: var(--danger); color: #fff; }
  button.active { background: var(--text); color: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .emoji { font-size: 32px; width: 44px; text-align: center; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .sub { color: var(--muted); font-size: 14px; }
  .price { font-weight: 800; color: var(--accent); white-space: nowrap; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 13px; padding: 3px 8px; border-radius: 8px; background: var(--warn); color: #3a2a00; }
  .empty { color: var(--muted); text-align: center; padding: 16px; }
  form.row { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); min-width: 0;
  }
  .grow { flex: 1 1 160px; }
  .narrow { width: 90px; }
  .hist { font-size: 15px; padding: 6px 0; border-bottom: 1px dashed var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .plus { color: var(--accent-2); font-weight: 700; }
  .minus { color: var(--danger); font-weight: 700; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐷 Копилка заданий</h1>
    <div class="sub" id="hello"></div>
  </header>

  <div class="balance">
    <div>На счету</div>
    <div class="sum" id="balance">0 ₽</div>
    <div class="goal" id="goal"></div>
  </div>

  <div class="tabs">
    <button id="tab-kid" class="active">🧒 Ребёнок</button>
    <button id="tab-parent">👨‍👩‍👧 Родитель</button>
  </div>

  <!-- Режим ребёнка -->
  <section id="kid">
    <h2>Мои задания</h2>
    <div id="my-tasks"></div>
    <h2>Выбери работу</h2>
    <div id="available"></div>
    <h2>История</h2>
    <div id="history-kid"></div>
  </section>

  <!-- Режим родителя -->
  <section id="parent" hidden>
    <h2>Ждут проверки</h2>
    <div id="pending"></div>

    <h2>Задания</h2>
    <div id="catalog"></div>
    <form class="row" id="add-chore">
      <input class="narrow" id="new-emoji" placeholder="🧹" maxlength="4">
      <input class="grow" id="new-title" placeholder="Название задания" required>
      <input class="narrow" id="new-price" type="number" min="1" placeholder="₽" required>
      <button class="primary" type="submit">Добавить</button>
    </form>

    <h2>Выдать деньги</h2>
    <form class="row" id="payout">
      <input class="grow" id="payout-sum" type="number" min="1" placeholder="Сумма, ₽" required>
      <button class="danger" type="submit">Выдать</button>
    </form>

    <h2>Настройки</h2>
    <form class="row" id="settings">
      <input class="grow" id="set-name" placeholder="Имя ребёнка">
      <input class="grow" id="set-goal-title" placeholder="Цель (например, Лего)">
      <input class="narrow" id="set-goal-sum" type="number" min="0" placeholder="₽">
      <input class="narrow" id="set-pin" inputmode="numeric" maxlength="8" placeholder="PIN">
      <button class="primary" type="submit">Сохранить</button>
    </form>
    <p class="sub">PIN по умолчанию — 1234. Смените его, чтобы ребёнок не подтверждал задания сам.</p>
    <button id="lock">🔒 Выйти из режима родителя</button>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'chores-app-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const DEFAULT = {
  name: '', pin: '1234', balance: 0, goalTitle: '', goalSum: 0,
  chores: [
    { id: uid(), emoji: '🛏️', title: 'Заправить кровать', price: 20 },
    { id: uid(), emoji: '🍽️', title: 'Помыть посуду', price: 50 },
    { id: uid(), emoji: '🧹', title: 'Подмести пол', price: 40 },
    { id: uid(), emoji: '🧸', title: 'Убрать игрушки', price: 30 },
    { id: uid(), emoji: '🗑️', title: 'Вынести мусор', price: 30 },
    { id: uid(), emoji: '🌱', title: 'Полить цветы', price: 20 },
    { id: uid(), emoji: '🐕', title: 'Погулять с собакой', price: 60 },
    { id: uid(), emoji: '🧺', title: 'Разобрать бельё', price: 40 },
  ],
  tasks: [],    // { id, choreId, emoji, title, price, status: 'taken' | 'done' }
  history: [],  // { date, text, amount }
};

let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || structuredClone(DEFAULT); }
catch { state = structuredClone(DEFAULT); }
let parentMode = false;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  render();
}

const $ = id => document.getElementById(id);
const rub = n => `${n} ₽`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

function addHistory(text, amount) {
  state.history.unshift({ date: new Date().toLocaleDateString('ru-RU'), text, amount });
  state.history = state.history.slice(0, 100);
}

function card(item, right) {
  return `<div class="card">
    <div class="emoji">${esc(item.emoji || '⭐')}</div>
    <div class="info"><div class="title">${esc(item.title)}</div>
      <div class="price">${rub(item.price)}</div></div>
    <div class="actions">${right}</div></div>`;
}

function render() {
  $('hello').textContent = state.name ? `Привет, ${state.name}! Выполняй задания и копи деньги` : 'Выполняй задания и копи деньги';
  $('balance').textContent = rub(state.balance);

  if (state.goalTitle && state.goalSum > 0) {
    const pct = Math.min(100, Math.round(state.balance / state.goalSum * 100));
    $('goal').innerHTML = `🎯 ${esc(state.goalTitle)}: ${rub(state.balance)} из ${rub(state.goalSum)} (${pct}%)
      <div class="bar"><div style="width:${pct}%"></div></div>`;
  } else $('goal').textContent = '';

  // Ребёнок
  $('my-tasks').innerHTML = state.tasks.length
    ? state.tasks.map(t => card(t, t.status === 'taken'
        ? `<button class="ok" data-done="${t.id}">✅ Сделал</button><button data-drop="${t.id}">✖</button>`
        : `<span class="badge">⏳ Ждёт проверки</span>`)).join('')
    : '<div class="empty">Пока ничего не выбрано</div>';

  $('available').innerHTML = state.chores.length
    ? state.chores.map(c => card(c, `<button class="primary" data-take="${c.id}">Беру!</button>`)).join('')
    : '<div class="empty">Родитель ещё не добавил задания</div>';

  const hist = state.history.length
    ? state.history.slice(0, 20).map(h => `<div class="hist"><span>${h.date} · ${esc(h.text)}</span>
        <span class="${h.amount >= 0 ? 'plus' : 'minus'}">${h.amount >= 0 ? '+' : ''}${rub(h.amount)}</span></div>`).join('')
    : '<div class="empty">Здесь появятся заработанные деньги</div>';
  $('history-kid').innerHTML = hist;

  // Родитель
  const pending = state.tasks.filter(t => t.status === 'done');
  $('pending').innerHTML = pending.length
    ? pending.map(t => card(t, `<button class="ok" data-approve="${t.id}">👍 Принять</button><button data-reject="${t.id}">Переделать</button>`)).join('')
    : '<div class="empty">Нечего проверять</div>';

  $('catalog').innerHTML = state.chores.map(c => card(c, `<button class="danger" data-del="${c.id}">Удалить</button>`)).join('');

  $('set-name').value = state.name;
  $('set-goal-title').value = state.goalTitle;
  $('set-goal-sum').value = state.goalSum || '';

  $('kid').hidden = parentMode;
  $('parent').hidden = !parentMode;
  $('tab-kid').classList.toggle('active', !parentMode);
  $('tab-parent').classList.toggle('active', parentMode);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;

  if (d.take) {
    const c = state.chores.find(x => x.id === d.take);
    state.tasks.push({ id: uid(), choreId: c.id, emoji: c.emoji, title: c.title, price: c.price, status: 'taken' });
    toast(`Задание «${c.title}» взято!`);
    save();
  } else if (d.done) {
    state.tasks.find(t => t.id === d.done).status = 'done';
    toast('Молодец! Попроси родителя проверить 👀');
    save();
  } else if (d.drop) {
    state.tasks = state.tasks.filter(t => t.id !== d.drop);
    save();
  } else if (d.approve) {
    const t = state.tasks.find(x => x.id === d.approve);
    state.balance += t.price;
    addHistory(t.title, t.price);
    state.tasks = state.tasks.filter(x => x.id !== t.id);
    toast(`+${rub(t.price)} на счёт 🎉`);
    save();
  } else if (d.reject) {
    state.tasks.find(t => t.id === d.reject).status = 'taken';
    toast('Задание возвращено ребёнку');
    save();
  } else if (d.del) {
    if (confirm('Удалить это задание?')) {
      state.chores = state.chores.filter(c => c.id !== d.del);
      save();
    }
  }
});

$('tab-kid').onclick = () => { parentMode = false; render(); };
$('lock').onclick = () => { parentMode = false; render(); };
$('tab-parent').onclick = () => {
  if (parentMode) return;
  const pin = prompt('Введите PIN родителя');
  if (pin === null) return;
  if (pin === state.pin) { parentMode = true; render(); }
  else toast('Неверный PIN');
};

$('add-chore').onsubmit = e => {
  e.preventDefault();
  const price = parseInt($('new-price').value, 10);
  if (!(price > 0)) return;
  state.chores.push({ id: uid(), emoji: $('new-emoji').value.trim() || '⭐', title: $('new-title').value.trim(), price });
  e.target.reset();
  toast('Задание добавлено');
  save();
};

$('payout').onsubmit = e => {
  e.preventDefault();
  const sum = parseInt($('payout-sum').value, 10);
  if (!(sum > 0)) return;
  if (sum > state.balance) { toast('На счету недостаточно денег'); return; }
  state.balance -= sum;
  addHistory('Выдано на руки', -sum);
  e.target.reset();
  toast(`Выдано ${rub(sum)}`);
  save();
};

$('settings').onsubmit = e => {
  e.preventDefault();
  state.name = $('set-name').value.trim();
  state.goalTitle = $('set-goal-title').value.trim();
  state.goalSum = parseInt($('set-goal-sum').value, 10) || 0;
  const pin = $('set-pin').value.trim();
  if (pin) state.pin = pin;
  $('set-pin').value = '';
  toast('Сохранено');
  save();
};

render();
</script>
</body>
</html>
