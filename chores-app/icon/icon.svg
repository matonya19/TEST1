<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3f6"/>
      <stop offset="1" stop-color="#1f7fd0"/>
    </linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa8c5"/>
      <stop offset="1" stop-color="#f27aa3"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="120" fill="#ffffff" opacity=".08"/>

  <!-- piggy bank -->
  <g transform="translate(0 30)">
    <!-- legs -->
    <rect x="160" y="350" width="46" height="60" rx="18" fill="#e0628d"/>
    <rect x="300" y="350" width="46" height="60" rx="18" fill="#e0628d"/>
    <!-- tail -->
    <path d="M410 250 q40 -10 30 25 q-8 22 -28 8" fill="none" stroke="#e0628d" stroke-width="14" stroke-linecap="round"/>
    <!-- ear -->
    <path d="M168 178 l-6 -62 l56 38 z" fill="#e0628d" stroke="#e0628d" stroke-width="10" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="262" cy="270" rx="160" ry="118" fill="url(#pig)"/>
    <!-- snout -->
    <ellipse cx="108" cy="276" rx="40" ry="46" fill="#f9a0bf" stroke="#e0628d" stroke-width="8"/>
    <ellipse cx="96" cy="262" rx="7" ry="11" fill="#c2456f"/>
    <ellipse cx="118" cy="290" rx="7" ry="11" fill="#c2456f"/>
    <!-- eye -->
    <circle cx="178" cy="232" r="13" fill="#3a1f2b"/>
    <circle cx="182" cy="227" r="4" fill="#fff"/>
    <!-- cheek -->
    <ellipse cx="190" cy="282" rx="18" ry="11" fill="#ff6f9a" opacity=".55"/>
    <!-- coin slot -->
    <rect x="236" y="160" width="86" height="16" rx="8" fill="#b83d66"/>
    <!-- belly letter -->
    <text x="282" y="335" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="92" fill="#ffffff" opacity=".9">В</text>
  </g>

  <!-- coin dropping in -->
  <g transform="translate(279 120)">
    <circle r="66" fill="url(#coin)" stroke="#c97c00" stroke-width="8"/>
    <circle r="48" fill="none" stroke="#fff3b0" stroke-width="5" opacity=".8"/>
    <text y="27" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="74" fill="#9a5b00">₾</text>
  </g>
</svg>
