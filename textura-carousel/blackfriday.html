<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #141210;
    --bg2: #1d1915;
    --ink: #ffffff;
    --muted: rgba(255,255,255,.72);
    --accent: #F2B76B;      /* тёплый неон TEXTURA */
    --accent-deep: #E39C45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font-family: 'Manrope', sans-serif; color: var(--ink); }
  .slide {
    width: 1080px; height: 1440px; position: relative; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 0%, #241f19 0%, var(--bg) 60%);
    margin-bottom: 40px;
  }
  .photo { position: absolute; left: 0; right: 0; bottom: 0; background-size: cover; }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--bg) 0%, rgba(20,18,16,.75) 18%, rgba(20,18,16,0) 45%, rgba(20,18,16,0) 80%, rgba(20,18,16,.55) 100%);
  }
  .content { position: relative; z-index: 2; padding: 0 90px; }

  /* top bar */
  .badge {
    position: absolute; top: 62px; left: 70px; z-index: 3;
    background: #000; border-radius: 40px; padding: 16px 32px 16px 28px;
    font-weight: 800; font-size: 26px; letter-spacing: .14em; display: flex; align-items: center; gap: 14px;
  }
  .badge i { width: 15px; height: 15px; background: var(--accent); transform: rotate(45deg); display: block; }
  .logo { position: absolute; top: 58px; right: 70px; z-index: 3; text-align: center; }
  .logo .neon {
    border: 2.5px solid rgba(255,236,206,.9); border-radius: 18px; padding: 8px 18px 7px;
    font-weight: 800; font-size: 30px; letter-spacing: .08em; color: #fff7ea;
    text-shadow: 0 0 10px rgba(242,183,107,.9), 0 0 24px rgba(242,183,107,.6);
    box-shadow: 0 0 14px rgba(242,183,107,.55), inset 0 0 10px rgba(242,183,107,.35);
  }
  .logo .sub { margin-top: 10px; font-size: 14px; letter-spacing: .38em; font-weight: 600; color: rgba(255,255,255,.75); }
  .counter { position: absolute; bottom: 56px; right: 70px; z-index: 3; font-weight: 700; font-size: 24px; letter-spacing: .1em; color: rgba(255,255,255,.75); }
  .counter b { color: var(--accent); }

  .kicker { font-weight: 800; font-size: 27px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.82); text-align: center; }
  .kicker span { color: var(--accent); }
  h1 { font-weight: 800; font-size: 74px; line-height: 1.06; letter-spacing: -.015em; text-align: center; }
  h1 .hl { color: var(--accent); }
  .lead { font-weight: 500; font-size: 36px; line-height: 1.32; color: var(--muted); text-align: center; }

  .take {
    display: flex; gap: 30px; align-items: center;
    border: 3px solid var(--accent); border-radius: 44px; padding: 32px 40px;
    background: rgba(12,10,8,.78); backdrop-filter: blur(6px);
  }
  .take .ic { flex: 0 0 auto; width: 84px; height: 84px; border: 3px solid var(--accent); border-radius: 24px; display: grid; place-items: center; }
  .take .ic svg { width: 44px; height: 44px; stroke: var(--accent); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .take p { font-weight: 700; font-size: 32px; line-height: 1.3; }
  .take p span { color: var(--accent); }

  /* cover */
  .cover h1 { font-size: 92px; line-height: 1.02; }
  .cta-pill {
    display: inline-flex; align-items: center; gap: 18px; background: var(--accent); color: #141210;
    border-radius: 70px; padding: 26px 46px; font-weight: 800; font-size: 44px;
  }

  /* chain */
  .chain { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .chain div { border: 3px solid var(--accent); border-radius: 28px; padding: 18px 26px; font-weight: 800; font-size: 30px; text-align: center; line-height: 1.15; background: rgba(12,10,8,.6); }
  .chain em { font-style: normal; color: var(--accent); font-size: 38px; font-weight: 800; }

  /* chat */
  .chat { display: flex; flex-direction: column; gap: 18px; }
  .bubble { max-width: 78%; padding: 24px 34px; border-radius: 36px; font-weight: 700; font-size: 34px; line-height: 1.25; }
  .bubble.them { background: rgba(255,255,255,.12); border-bottom-left-radius: 10px; align-self: flex-start; }
  .bubble.me { background: var(--accent); color: #141210; border-bottom-right-radius: 10px; align-self: flex-end; }
  .bubble small { display: block; font-size: 20px; letter-spacing: .14em; font-weight: 800; text-transform: uppercase; opacity: .6; margin-bottom: 6px; }

  /* rows (slide 7) */
  .row { display: flex; gap: 36px; align-items: flex-start; padding: 34px 0; }
  .row + .row { border-top: 2px solid rgba(255,255,255,.18); }
  .row .ic { flex: 0 0 auto; width: 100px; height: 100px; border: 3px solid var(--accent); border-radius: 28px; display: grid; place-items: center; }
  .row .ic svg { width: 50px; height: 50px; stroke: var(--accent); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .row.neg .ic { border-color: rgba(255,255,255,.55); }
  .row.neg .ic svg { stroke: rgba(255,255,255,.75); }
  .row h3 { font-weight: 800; font-size: 40px; line-height: 1.12; margin-bottom: 10px; }
  .row p { font-weight: 500; font-size: 30px; line-height: 1.3; color: var(--muted); }

  /* final */
  .final { background: radial-gradient(90% 60% at 30% 20%, #F8CF92 0%, var(--accent) 45%, var(--accent-deep) 100%); color: #141210; }
  .final .logo .neon { border-color: #141210; color: #141210; text-shadow: none; box-shadow: none; }
  .final .logo .sub { color: rgba(20,18,16,.75); }
  .final .counter { color: rgba(20,18,16,.7); }
  .final .counter b { color: #141210; }

  .bf h1 { font-size: 80px; }
  .price-old { font-weight: 700; font-size: 54px; color: rgba(255,255,255,.55); text-decoration: line-through; text-decoration-thickness: 4px; text-decoration-color: var(--accent); }
  .price-new { font-weight: 800; font-size: 150px; line-height: 1; letter-spacing: -.02em; }
  .price-new small { font-size: 90px; }
  .off { display:inline-block; background: var(--accent); color:#141210; border-radius: 60px; padding: 14px 34px; font-weight: 800; font-size: 46px; }
</style>
</head>
<body>
<section class="slide bf" id="s1">
  <div class="photo" style="top:820px; background-image:url(photos/camera.jpg); background-position:55% 50%;"></div>
  <div class="badge"><i></i>BLACK FRIDAY</div>
  <div class="logo"><div class="neon">TEXTURA</div><div class="sub">TALKS</div></div>
  <div class="content" style="padding-top:220px; text-align:center;">
    <div class="kicker">Онлайн-курс · <span>интервью</span></div>
    <h1 style="margin-top:30px;">Чёрная пятница<br>в <span class="hl">TEXTURA Talks</span></h1>
    <div style="margin-top:44px; display:flex; align-items:center; justify-content:center; gap:28px;">
      <span class="price-old">19 900 ₽</span><span class="price-old">$240</span><span class="off">−25%</span>
    </div>
    <div style="margin-top:22px; display:flex; align-items:baseline; justify-content:center; gap:30px;">
      <span class="price-new" style="font-size:124px;">14 900 <small style="font-size:76px;">₽</small></span><span style="font-size:90px; font-weight:400; color:rgba(255,255,255,.35);">/</span>
      <span class="price-new" style="font-size:124px; color:var(--accent);">$180</span>
    </div>
    <p class="lead" style="margin-top:22px;">Выгода 5 000 ₽ / $60</p>
  </div>
  <div style="position:absolute; left:0; right:0; bottom:120px; z-index:3; text-align:center;">
    <div class="cta-pill">Напишите «ДИАЛОГ» в Direct <span>→</span></div>
  </div>
</section>
</body></html>
