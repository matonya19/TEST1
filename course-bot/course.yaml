# ------------------------------------------------------------
#  ЭФИРЫ И ОФЛАЙН-ВСТРЕЧИ — бот пришлёт напоминания
#  datetime  — дата и время начала, в кавычках
#  kind      — эфир / офлайн (влияет только на значок)
#  place     — адрес или площадка (необязательно)
#  link      — ссылка на эфир / регистрацию / карту (необязательно)
#  reminders — когда напомнить: 1d = за день, 3h = за 3 часа, 15m = за 15 минут, 0 = в момент начала.
#              Если не указано, берётся default_reminders.
# ------------------------------------------------------------
default_reminders: [1d, 1h]

events:
  - title: "Эфир «ЗАМЕНИТЕ: тема»"
    kind: эфир
    datetime: "2026-11-26 19:00"
    link: "https://ЗАМЕНИТЕ"
    reminders: [1d, 1h, 0]
    text: "Подключайтесь, готовьте вопросы!"

  - title: Офлайн-встреча
    kind: офлайн
    datetime: "2026-12-06 15:00"
    place: "ЗАМЕНИТЕ: адрес"
    reminders: [2d, 1d, 2h]
    text: "Возьмите с собой ноутбук и хорошее настроение."
