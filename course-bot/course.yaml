# ============================================================
#  Расписание курса. Это единственный файл, который нужно править.
# ============================================================

# Пока стоит false, бот ничего не публикует. Заполните тексты и поставьте true.
enabled: false

timezone: Europe/Moscow
start_date: 2026-11-23      # дата 1-го дня курса (ГГГГ-ММ-ДД)
post_time: "10:00"          # время поста по умолчанию
# Если в день несколько постов: время 1-го, 2-го, 3-го… поста дня (если у поста не указано своё time)
post_times: ["10:00", "14:00", "19:00"]

# Если бот по какой-то причине не сработал вовремя, пост всё равно выйдет в течение
# стольких часов. Позже — будет пропущен, чтобы не прислать «вчерашний» пост.
catch_up_hours: 12

# Разметка текста: HTML (<b>жирный</b>, <i>курсив</i>, <a href="https://...">ссылка</a>)
parse_mode: HTML

# ------------------------------------------------------------
#  ПОСТЫ КУРСА. Один блок «- day:» = одно сообщение в группе.
#  Несколько видео в день = несколько блоков с одним и тем же day.
#
#  day       — номер дня курса (1 = start_date). Вместо day можно указать date: 2026-11-25
#  time      — необязательно; иначе берётся из post_times по порядку. Пишите в кавычках: "19:30"
#  video     — код видео, которое вы прислали боту в личку с подписью, например "1.2"
#              (также можно ссылку https://… или file_id)
#  text      — описание к видео
#  practice  — задание для практики, выводится отдельным блоком «📝 Практика»
#  С видео до 1024 символов текст уходит подписью, длиннее — отдельным сообщением сразу после видео.
#  Посты с текстом «ЗАМЕНИТЕ» бот не отправит — защита от незаполненных шаблонов.
# ------------------------------------------------------------
posts:

  # ========== Неделя 1 ==========
  - day: 1
    video: "1.1"
    text: |
      <b>День 1 · Видео 1.</b> ЗАМЕНИТЕ: тема

      ЗАМЕНИТЕ: описание
    practice: |
      ЗАМЕНИТЕ: задание для практики

