      🎬 <b>Урок 1. Интервью или подкаст?</b>

      Кажется, что достаточно включить микрофоны, посадить двух интересных людей — и хороший разговор получится сам собой.

      Но даже самому свободному диалогу нужна структура.

      В этом уроке Полина объясняет, чем отличается роль ведущего в интервью и разговорном подкасте и почему важно заранее договориться, кто направляет беседу.

      🎯 <b>Попробуйте</b>

      Вспомните интервью или подкаст, который вы недавно смотрели.

      Кто управлял разговором? Задавал ли ведущий уточняющие вопросы? Или собеседники просто обменивались мнениями?

      💬 <b>Поделитесь в чате:</b> пришлите название или ссылку на интересное интервью и напишите, что вам в нём понравилось.

  - date: 2026-11-27
    time: "11:00"
    text: |
      🎙 <b>А кого бы вы пригласили на интервью?</b>

      Совсем скоро мы начнём разбирать техники, которые помогают раскрывать собеседника.

      Но сначала представьте, что у вас уже есть микрофон, студия и возможность пригласить любого человека.

      Кто бы это был?

      Необязательно знаменитость. Возможно, это предприниматель, знакомый эксперт, коллега или человек с необычной историей.

      🎯 <b>Задание</b>

      Выберите одного человека и придумайте три вопроса, которые вам действительно хотелось бы ему задать.

      💬 Напишите в чат, кого выбрали и какой вопрос задали бы первым.

      На следующей неделе будем учиться превращать такие вопросы в интересный разговор.

  - date: 2026-11-30
    video: "1.3"
    time: "11:00"
    text: |
      🎬 <b>Урок 2. Хорошее интервью начинается до записи</b>

      Ведущий — это не просто человек со списком вопросов.
      Он помогает гостю раскрыться, следит за темой и делает разговор интересным для зрителя.

      В этом уроке Полина рассказывает, почему подготовка так важна: как изучить гостя, выбрать тему и продумать структуру интервью.

      💡 <b>Пример</b>
      Вместо общей темы «Поговорим о бизнесе» можно выбрать конкретную:
      «Как предприниматель пережил первый серьёзный кризис и что изменил после него».
      Сразу понятнее, о чём будет разговор и зачем его смотреть.

      🎯 <b>Практика</b>
      Выберите потенциального гостя и запишите:

      1. Чем он вам интересен?
      2. О чём вы хотели бы с ним поговорить?
      3. Что полезного зритель узнает из этого разговора?

      💬 Поделитесь в чате своей темой интервью одним предложением.

  - date: 2026-12-01
