# ============================================================
#  Расписание курса. Это единственный файл, который нужно править.
# ============================================================

# Пока стоит false, бот ничего не публикует. Заполните тексты и поставьте true.
enabled: false

timezone: Europe/Moscow
start_date: 2026-11-23      # дата 1-го дня курса (ГГГГ-ММ-ДД)
post_time: "10:00"          # во сколько выходит пост дня, если у поста не указано своё time

# Если бот по какой-то причине не сработал вовремя, пост всё равно выйдет в течение
# стольких часов. Позже — будет пропущен, чтобы не прислать «вчерашний» пост.
catch_up_hours: 12

# Разметка текста: HTML (<b>жирный</b>, <i>курсив</i>, <a href="https://...">ссылка</a>)
parse_mode: HTML

# ------------------------------------------------------------
#  ПОСТЫ КУРСА
#  day      — номер дня курса (1 = start_date). Вместо day можно указать date: 2026-11-25
#  time     — необязательно, по умолчанию post_time. Время пишите в кавычках: "19:30"
#  video    — file_id видео (см. README), ссылка https://... или путь к файлу в папке course-bot
#             Вместо video можно photo или document. Одно вложение на пост.
#  text     — описание. С видео до 1024 символов уходит подписью, длиннее — отдельным сообщением.
#  В один день можно сделать несколько постов: просто два блока с одинаковым day и разным time.
#  Посты с текстом «ЗАМЕНИТЕ» бот не отправит, это защита от незаполненных шаблонов.
# ------------------------------------------------------------
posts:
