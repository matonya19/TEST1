      У вас есть список вопросов. Но гость неожиданно затрагивает тему, которая может оказаться гораздо интереснее.

      Что делать — возвращаться к плану или продолжить?

      В этом уроке учимся находить баланс между подготовленной структурой и живым разговором.

      🎯 <b>Практика</b>

      Возьмите свои вопросы к будущему интервью.

      Выделите три обязательных — те, без которых тема не раскроется. Остальные оставьте как дополнительные.

      💬 Напишите в чат один вопрос, который обязательно должен прозвучать в вашем интервью.

  - date: 2026-12-03
    video: "1.9"
    time: "10:00"
    text: |
      🎬 <b>Урок 8. Почему даже интересный разговор может быть скучно слушать</b>

      Дело не всегда в содержании.

      Иногда собеседники говорят в одном темпе, не меняют интонацию и почти не реагируют друг на друга.

      В этом уроке Полина показывает, как ведущему чувствовать настроение гостя и управлять динамикой разговора, не перетягивая внимание на себя.

      🎯 <b>Практика</b>

      Произнесите одну фразу тремя способами: спокойно, с удивлением и с искренним интересом.

      Например: «И что произошло дальше?»

      Запишите голосовое сообщение и послушайте, как меняется смысл.

      💬 По желанию отправьте запись в чат.

