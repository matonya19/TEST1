# ============================================================
#  Расписание курса. Это единственный файл, который нужно править.
# ============================================================

# Пока стоит false, бот ничего не публикует. Заполните тексты и поставьте true.
enabled: true

timezone: Europe/Moscow
start_date: 2026-11-24      # дата 1-го дня курса (ГГГГ-ММ-ДД)
post_time: "10:00"          # время поста по умолчанию
# Если в день несколько постов: время 1-го, 2-го, 3-го… поста дня (если у поста не указано своё time)
post_times: ["10:00", "14:00", "19:00"]

# Если бот по какой-то причине не сработал вовремя, пост всё равно выйдет в течение
# стольких часов. Позже — будет пропущен, чтобы не прислать «вчерашний» пост.
catch_up_hours: 12

# Разметка текста: HTML (<b>жирный</b>, <i>курсив</i>, <a href="https://...">ссылка</a>)
parse_mode: HTML

# ------------------------------------------------------------
#  ПОСТЫ КУРСА. Один блок «- day:» = одно сообщение в группе.
#  Несколько видео в день = несколько блоков с одним и тем же day.
#
#  day       — номер дня курса (1 = start_date). Вместо day можно указать date: 2026-11-25
#  time      — необязательно; иначе берётся из post_times по порядку. Пишите в кавычках: "19:30"
#  video     — код видео, которое вы прислали боту в личку с подписью, например "1.2"
#              (также можно ссылку https://… или file_id)
#  text      — описание к видео
#  practice  — задание для практики, выводится отдельным блоком «📝 Практика»
#  С видео до 1024 символов текст уходит подписью, длиннее — отдельным сообщением сразу после видео.
#  Посты с текстом «ЗАМЕНИТЕ» бот не отправит — защита от незаполненных шаблонов.
# ------------------------------------------------------------
posts:
  # ========== Неделя 1 ==========
  - day: 1
    video: "1.1"
    time: "11:00"
    text: |
      🎙 <b>Добро пожаловать в «Текстуру диалога»!</b>

      В ближайшие три недели будем учиться разговаривать так, чтобы нас хотелось слушать, а с нами — продолжать диалог.

      Вы попробуете себя в двух ролях: ведущего, который умеет задавать вопросы и раскрывать собеседника, и гостя, который интересно рассказывает о себе и своей экспертизе.

      Здесь не нужно быть профессиональным журналистом или опытным спикером. Главное — пробовать.

      <b>Начнём со знакомства!</b>

      💬 Напишите в общий чат:
      — Как вас зовут и чем вы занимаетесь?
      — Почему решили прийти на курс?
      — Что сложнее лично для вас: задавать вопросы или отвечать на них?

      Будем знакомиться не только по именам, но и по историям друг друга ❤️

  - date: 2026-11-26
    video: "1.2"
    time: "11:00"
    text: |
      🎬 <b>Урок 1. Интервью или подкаст?</b>

      Кажется, что достаточно включить микрофоны, посадить двух интересных людей — и хороший разговор получится сам собой.

      Но даже самому свободному диалогу нужна структура.

      В этом уроке Полина объясняет, чем отличается роль ведущего в интервью и разговорном подкасте и почему важно заранее договориться, кто направляет беседу.

      🎯 <b>Попробуйте</b>

      Вспомните интервью или подкаст, который вы недавно смотрели.

      Кто управлял разговором? Задавал ли ведущий уточняющие вопросы? Или собеседники просто обменивались мнениями?

      💬 <b>Поделитесь в чате:</b> пришлите название или ссылку на интересное интервью и напишите, что вам в нём понравилось.

  - date: 2026-11-27
    time: "11:00"
    text: |
      🎙 <b>А кого бы вы пригласили на интервью?</b>

      Совсем скоро мы начнём разбирать техники, которые помогают раскрывать собеседника.

      Но сначала представьте, что у вас уже есть микрофон, студия и возможность пригласить любого человека.

      Кто бы это был?

      Необязательно знаменитость. Возможно, это предприниматель, знакомый эксперт, коллега или человек с необычной историей.

      🎯 <b>Задание</b>

      Выберите одного человека и придумайте три вопроса, которые вам действительно хотелось бы ему задать.

      💬 Напишите в чат, кого выбрали и какой вопрос задали бы первым.

      На следующей неделе будем учиться превращать такие вопросы в интересный разговор.

  - date: 2026-11-30
    video: "1.3"
    time: "11:00"
    text: |
      🎬 <b>Урок 2. Хорошее интервью начинается до записи</b>

      Ведущий — это не просто человек со списком вопросов.
      Он помогает гостю раскрыться, следит за темой и делает разговор интересным для зрителя.

      В этом уроке Полина рассказывает, почему подготовка так важна: как изучить гостя, выбрать тему и продумать структуру интервью.

      💡 <b>Пример</b>
      Вместо общей темы «Поговорим о бизнесе» можно выбрать конкретную:
      «Как предприниматель пережил первый серьёзный кризис и что изменил после него».
      Сразу понятнее, о чём будет разговор и зачем его смотреть.

      🎯 <b>Практика</b>
      Выберите потенциального гостя и запишите:

      1. Чем он вам интересен?
      2. О чём вы хотели бы с ним поговорить?
      3. Что полезного зритель узнает из этого разговора?

      💬 Поделитесь в чате своей темой интервью одним предложением.

  - date: 2026-12-01
    video: "1.4"
    time: "10:00"
    text: |
      🎬 <b>Урок 3. Самый важный вопрос — тот, которого нет в списке</b>

      Представьте: вы подготовили десять отличных вопросов. Гость отвечает на первый — и вдруг рассказывает неожиданную историю.

      А вы уже думаете, как бы не забыть второй вопрос.

      Знакомо?

      Полина объясняет, почему хороший интервьюер должен не только спрашивать, но и по-настоящему слушать.

      🎯 <b>Практика</b>

      В следующем разговоре попробуйте не готовить ответ заранее.

      Дослушайте собеседника и задайте один вопрос, который возник именно из его слов.

      💬 Был ли ответ неожиданным? Расскажите в чате.

  - date: 2026-12-01
    video: "1.5"
    time: "16:00"
    text: |
      🎬 <b>Урок 4. Как задавать вопросы, на которые невозможно ответить одним «да»</b>

      «Вам понравилось открывать бизнес?»

      «Да».

      И разговор закончился, не успев начаться.

      А теперь попробуйте иначе:

      «Что оказалось самым неожиданным, когда вы открыли бизнес?»

      Один вопрос — и перед нами уже может появиться целая история.

      В этом уроке разбираем открытые вопросы и учимся разговорить даже немногословного гостя.

      🎯 <b>Практика</b>

      Переделайте три закрытых вопроса в открытые:

      — Вам нравится ваша работа?
      — Было страшно начинать?
      — Вы довольны результатом?

      💬 Опубликуйте в чате один самый интересный вариант.

  - date: 2026-12-02
    video: "1.6"
    time: "10:00"
    text: |
      🎬 <b>Урок 5. Как одним словом раскрыть целую историю</b>

      Иногда лучший следующий вопрос состоит всего из одного слова.

      Гость: «Это было самое неожиданное решение в моей жизни».

      Ведущий: «Неожиданное?»

      И собеседник начинает объяснять, что именно произошло.

      Это техника эха. Она помогает углублять разговор, не превращая интервью в допрос.

      🎯 <b>Практика</b>

      Сегодня попробуйте применить технику эха в обычном разговоре. Повторите значимое слово собеседника с вопросительной интонацией.

      💬 Расскажите, получилось ли узнать что-то новое.

  - date: 2026-12-02
    video: "1.7"
    time: "14:00"
    text: |
      🎬 <b>Урок 6. Не бойтесь тишины</b>

      В разговоре возникает пауза — и хочется немедленно заполнить её словами.

      Но иногда именно после нескольких секунд тишины человек добавляет самое интересное.

      Полина рассказывает, почему паузы не портят интервью, а помогают сделать его живым.

      🎯 <b>Практика</b>

      В следующем разговоре после ответа собеседника выдержите паузу в 2–3 секунды.

      Не торопитесь задавать новый вопрос.

      💬 Что произошло? Человек продолжил мысль или разговор пошёл дальше?

  - date: 2026-12-02
    video: "1.8"
    time: "17:00"
    text: |
      🎬 <b>Урок 7. План нужен, но интереснее бывает без него</b>

      У вас есть список вопросов. Но гость неожиданно затрагивает тему, которая может оказаться гораздо интереснее.

      Что делать — возвращаться к плану или продолжить?

      В этом уроке учимся находить баланс между подготовленной структурой и живым разговором.

      🎯 <b>Практика</b>

      Возьмите свои вопросы к будущему интервью.

      Выделите три обязательных — те, без которых тема не раскроется. Остальные оставьте как дополнительные.

      💬 Напишите в чат один вопрос, который обязательно должен прозвучать в вашем интервью.

  # ----- Шаблон для следующих постов (скопировать, убрать # в начале строк) -----
  # - day: 1
  #   video: "1.2"
  #   time: "14:00"
  #   text: |
  #     Описание
  #   practice: |
  #     Задание для практики

# ------------------------------------------------------------
#  ЭФИРЫ И ОФЛАЙН-ВСТРЕЧИ — бот пришлёт напоминания
#  datetime  — дата и время начала, в кавычках
#  kind      — эфир / офлайн (влияет только на значок)
#  place     — адрес или площадка (необязательно)
#  link      — ссылка на эфир / регистрацию / карту (необязательно)
#  reminders — когда напомнить: 1d = за день, 3h = за 3 часа, 15m = за 15 минут, 0 = в момент начала.
#              Если не указано, берётся default_reminders.
# ------------------------------------------------------------
default_reminders: [1d, 1h]

events: []
  # Пример (убрать [] выше и # в начале строк):
  # - title: "Эфир «Тема»"
  #   kind: эфир
  #   datetime: "2026-11-26 19:00"
  #   link: "https://…"
  #   reminders: [1d, 1h, 0]
  #   text: "Подключайтесь, готовьте вопросы!"
