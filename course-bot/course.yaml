  # ========== Неделя 2 — «Как давать интервью» ==========
  - date: 2026-12-07
    time: "10:00"
    text: |
      🎙 <b>А теперь микрофон переходит к вам!</b>

      На прошлой неделе мы учились задавать вопросы, слушать собеседника и вести интересный разговор.

      А теперь меняемся местами!

      Представьте: вас пригласили на интервью. Камеры включены, ведущий задаёт первый вопрос:

      <b>«Расскажите немного о себе».</b>

      И тут в голове сразу столько мыслей, что непонятно, с чего начать 😅

      Знакомо?

      Сегодня начинаем второй блок курса <b>«Как давать интервью»</b>.

      Будем разбираться, как:
      ✨ рассказывать о себе без длинного перечисления регалий;
      ✨ отвечать интересно, а не просто правильно;
      ✨ доносить свои мысли так, чтобы их запоминали;
      ✨ справляться с неудобными вопросами;
      ✨ чувствовать себя увереннее в роли гостя.

      И начнём с самого главного — как подготовиться к интервью и понять, что именно вы хотите донести до зрителя.

      💬 <b>А пока вопрос к вам:</b>

      Что вас больше всего пугает в роли гостя — забыть мысль, не знать, что ответить, или показаться неинтересным?

      Пишите в чат, обсудим!

      Ну что, готовы оказаться по другую сторону микрофона? 🎤

  - date: 2026-12-07
    video: "2.1"
    time: "11:00"
    text: |
      🎬 <b>Урок 13. Что делать, если вас пока никто не приглашает на интервью?</b>

      Необязательно ждать, пока кто-то сам предложит вам стать гостем подкаста.

      Можно находить интересные площадки, знакомиться с ведущими и предлагать темы, которые будут полезны их аудитории.

      В этом уроке Полина рассказывает, как искать возможности для интервью и готовиться к разговору, когда приглашение уже получено.

      💡 <b>Пример</b>

      Вместо «Здравствуйте, я эксперт, пригласите меня на подкаст» попробуйте:

      «Я работаю с предпринимателями и могу рассказать о трёх ошибках, из-за которых клиенты уходят после первой встречи».

      🎯 <b>Практика</b>

      Найдите два подкаста или проекта, где вам было бы интересно выступить.

      Для одного из них придумайте конкретную тему, с которой могли бы прийти.

      💬 Поделитесь темой в чате.

  - date: 2026-12-07
    video: "2.2"
    time: "16:00"
    text: |
      🎬 <b>Урок 14. Что люди должны запомнить после вашего интервью?</b>

      Представьте, что зритель посмотрел часовой разговор с вами.

      Что он сможет рассказать о вас другу одним предложением?

      Именно об этом сегодняшний урок. Полина объясняет, почему важно заранее определить главную идею и возвращаться к ней в разговоре.

      💡 <b>Пример</b>

      Не просто «Я занимаюсь образованием».

      А «Я помогаю детям учиться без постоянного страха ошибиться».

      🎯 <b>Практика</b>

      Закончите предложение:

      «После интервью со мной я хочу, чтобы люди поняли, что…»

      Постарайтесь уложиться в одну фразу.

      💬 Напишите её в чат.

  - date: 2026-12-08
    video: "2.3"
    time: "10:00"
    text: |
      🎬 <b>Урок 15. Как отвечать, чтобы вас было легко слушать</b>

      Иногда человек начинает отвечать на вопрос, уходит в детали и в конце сам забывает, с чего начал.

      Один из способов избежать этого — разделить ответ на несколько понятных пунктов.

      💡 <b>Пример</b>

      Вопрос: «Что помогло вам начать своё дело?»

      Ответ: «Три вещи: опыт, поддержка близких и первый клиент, который поверил в мою идею».

      Теперь каждую мысль можно раскрыть отдельно.

      🎯 <b>Практика</b>

      Ответьте на вопрос «Что самое важное в моей работе?» с помощью трёх пунктов.

      Попробуйте уложиться в одну минуту.

      💬 Можно отправить ответ голосовым сообщением.

  - date: 2026-12-08
    video: "2.4"
    time: "13:00"
    text: |
      🎬 <b>Урок 16. Как объяснить сложное так, чтобы поняли все</b>

      Не каждому зрителю знакомы профессиональные термины вашей сферы.

      Но почти каждому понятны сравнения с обычной жизнью.

      Сегодня учимся использовать метафоры, чтобы делать ответы более понятными и запоминающимися.

      💡 <b>Пример</b>

      Вместо «Контент-стратегия обеспечивает последовательную коммуникацию бренда» можно сказать:

      «Контент-стратегия — это маршрут. Без него можно много двигаться, но так и не приехать туда, куда собирались».

      🎯 <b>Практика</b>

      Возьмите один сложный термин из своей профессии и объясните его через знакомый предмет или жизненную ситуацию.

      💬 Поделитесь своим сравнением в чате.

  - date: 2026-12-08
    video: "2.5"
    time: "16:00"
    text: |
      🎬 <b>Урок 17. Почему истории запоминаются лучше перечисления фактов</b>

      Можно сказать: «У меня большой опыт работы с клиентами».

      А можно рассказать об одном клиенте, после встречи с которым вы полностью изменили свой подход.

      Второй вариант помогает зрителю увидеть ваш опыт в действии.

      В этом уроке Полина рассказывает, как использовать личные истории в ответах и не терять основную мысль.

      🎯 <b>Практика</b>

      Вспомните одну историю из своей профессиональной жизни.

      Постройте её по схеме:

      <b>Что произошло → что вы сделали → чем всё закончилось → что поняли.</b>

      Попробуйте рассказать её за одну минуту.

      💬 Если готовы, поделитесь историей в чате.

  - date: 2026-12-09
    video: "2.6"
    time: "10:00"
    text: |
      🎬 <b>Урок 18. Интервью — это не экзамен</b>

      Ведущий спрашивает. Вы отвечаете. Следующий вопрос. Следующий ответ.

      Так разговор легко превращается в анкетирование.

      Но даже в роли гостя можно поддерживать живой диалог.

      В этом уроке Полина показывает технику «ответ + вопрос», которая помогает вовлекать ведущего в беседу.

      💡 <b>Пример</b>

      «Для меня самым сложным было решиться на первый шаг. А у вас был момент, когда пришлось начинать что-то совершенно новое?»

      🎯 <b>Практика</b>

      Придумайте два вопроса, которые вы могли бы задать ведущему после своего ответа.

      Важно, чтобы они естественно продолжали тему.

      💬 Напишите один вариант в чат.

  - date: 2026-12-09
    video: "2.7"
    time: "13:00"
    text: |
      🎬 <b>Урок 19. Что делать, если вам задали вопрос, на который не хочется отвечать</b>

      Иногда вопросы бывают слишком личными, неожиданными или провокационными.

      Вы не обязаны отвечать на всё только потому, что находитесь перед камерой.

      Полина рассказывает, как сохранять спокойствие, обозначать границы и не терять управление собственным ответом.

      💡 <b>Пример</b>

      «Я бы не хотела обсуждать личные детали, но могу рассказать, какой вывод сделала из этой ситуации».

      🎯 <b>Практика</b>

      Представьте, что вам задали вопрос, на который вы не готовы отвечать.

      Подготовьте две формулировки: одну — для вежливого отказа, вторую — для возвращения к теме интервью.

      💬 Какую фразу вам было бы комфортнее произнести?

  - date: 2026-12-09
    video: "2.8"
    time: "16:00"
    text: |
      🎬 <b>Урок 20. Как отвечать, чтобы ведущему хотелось спросить ещё</b>

      Иногда гость отвечает настолько законченно, что ведущему просто не за что зацепиться.

      А хороший диалог строится на продолжении мысли.

      В этом уроке Полина предлагает оставлять в ответах небольшие зацепки — детали, которые вызывают любопытство.

      💡 <b>Пример</b>

      «Когда я открывала первый бизнес, совершила ошибку, которая стоила мне трёх месяцев работы. После этого я совершенно иначе стала выбирать партнёров».

      Какой вопрос вам сразу хочется задать?

      🎯 <b>Практика</b>

      Придумайте ответ из двух-трёх предложений, в котором останется интересная деталь для следующего вопроса.

      💬 Отправьте ответ в чат. Пусть другие участники попробуют задать вам продолжение.

  - date: 2026-12-10
    video: "2.9"
    time: "10:00"
    text: |
      🎬 <b>Урок 21. Как представиться, чтобы вас захотелось слушать</b>

      «Меня зовут…, я окончила…, работала…, прошла обучение…»

      Знакомое начало?

      Но зрителю важнее понять не весь ваш профессиональный путь, а почему ему будет интересно вас слушать.

      В этом уроке Полина объясняет, как подготовить короткое и содержательное представление себя.

      💡 <b>Пример</b>

      «Я помогаю предпринимателям перестать бояться камеры и начать рассказывать о своём деле так, чтобы их понимали клиенты».

      🎯 <b>Практика</b>

      Подготовьте самопрезентацию на 30 секунд.

      Ответьте в ней на три вопроса: кто вы, кому помогаете и почему ваша тема важна.

      💬 Запишите голосовое или видео и отправьте в чат.

  - date: 2026-12-10
    video: "2.10"
    time: "16:00"
    text: |
      🎬 <b>Урок 22. Необязательно отвечать мгновенно</b>

      Вам задают вопрос, и кажется, что нужно немедленно начать говорить.

      Но небольшая пауза помогает собраться, выбрать главную мысль и ответить точнее.

      Сегодня Полина рассказывает, как использовать паузу перед ответом.

      🎯 <b>Практика</b>

      Попросите знакомого задать вам три неожиданных вопроса.

      Перед каждым ответом выдержите две секунды, сформулируйте основную мысль и только потом начинайте говорить.

      💬 Что оказалось сложнее: выдержать паузу или сформулировать ответ?

  - date: 2026-12-11
    video: "2.11"
    time: "10:00"
    text: |
      🎬 <b>Урок 23. Что делать, если ведущий растерялся или неправильно вас понял</b>

      Не каждое интервью идёт идеально.

      Ведущий может потерять мысль, задать не тот вопрос или неожиданно увести разговор в другую сторону.

      В этом уроке Полина рассказывает, как гостю поддержать разговор и при необходимости мягко уточнить свою позицию.

      💡 <b>Пример</b>

      «Кажется, я не совсем точно объяснила. Позвольте уточню, что имела в виду…»

      🎯 <b>Практика</b>

      Придумайте две фразы:
      — как помочь ведущему продолжить разговор;
      — как корректно исправить недопонимание.

      💬 Поделитесь одной фразой, которую готовы использовать в реальном интервью.

  - date: 2026-12-11
    video: "2.12"
    time: "13:00"
    text: |
      🎬 <b>Урок 24. Последняя минута: что сказать, чтобы вас запомнили</b>

      Интервью подходит к концу, а вы вдруг вспоминаете ещё пять важных мыслей.

      Хочется успеть рассказать всё.

      Но сильный финал — это не количество сказанного, а одна мысль, которая останется у зрителя.

      🎯 <b>Практика</b>

      Вернитесь к главной идее, которую сформулировали в начале недели.

      Представьте, что ведущий спрашивает: «Что бы вы хотели сказать нашим зрителям напоследок?»

      Подготовьте ответ на 20–30 секунд.

      💬 Запишите его голосом или текстом.

  - date: 2026-12-11
    video: "2.13"
    time: "16:00"
    text: |
      🎬 <b>Урок 25. Одна фраза, без которой ваши ответы станут лучше</b>

      «Спасибо за интересный вопрос…»

      Иногда мы произносим это автоматически, просто чтобы выиграть время перед ответом.

      Полина предлагает отказаться от этой привычки и начинать говорить по существу.

      🎯 <b>Практика</b>

      Ответьте на три вопроса о своей работе, ни разу не используя фразу «Спасибо за вопрос».

      Если нужно подумать — сделайте паузу.

      💬 Замечали ли вы за собой эту привычку?

  - date: 2026-12-14
    video: "2.14"
    time: "10:00"
    text: |
      🎬 <b>Урок 26. Как сидеть перед камерой и не выглядеть зажатым</b>

      Куда деть ноги? Можно ли менять положение? Нужно ли сидеть неподвижно?

      Когда человек впервые оказывается перед камерой, даже обычный стул становится отдельной задачей.

      В этом уроке Полина наглядно показывает, как найти удобное положение и сохранить естественность в кадре.

      🎯 <b>Практика</b>

      Поставьте телефон перед собой и запишите три коротких видео по 15 секунд в разных положениях.

      Посмотрите, где вы выглядите наиболее расслабленно и уверенно.

      💬 Какое положение оказалось самым комфортным?

  - date: 2026-12-14
    video: "2.15"
    time: "13:00"
    text: |
      🎬 <b>Урок 27. Куда деть руки во время интервью?</b>

      Стоит перед вами стол — и сразу возникает вопрос: куда положить руки, можно ли опираться на локти и как не задевать микрофон?

      Полина разбирает эти небольшие, но важные детали поведения в кадре.

      🎯 <b>Практика</b>

      Запишите 30-секундный рассказ за столом.

      Обратите внимание на руки, жесты, положение корпуса и случайные прикосновения к столу.

      💬 <b>Подготовка к субботе:</b> вспомните свою самопрезентацию, главную мысль и одну личную историю. На практике будем соединять всё это в живое интервью.

  - date: 2026-12-15
    time: "10:00"
    text: |
      🎯 <b>Практика дня: разговор без сценария</b>

      Сегодня у нас три техники: эхо, пауза и умение следовать за собеседником.

      Попробуйте провести пятиминутный разговор с любым человеком.

      Ваша задача:

      1. Хотя бы один раз использовать технику эха.
      2. Не заполнять каждую паузу словами.
      3. Задать вопрос, который возник из ответа собеседника.

      💬 Вечером поделитесь в чате: какая техника получилась естественно, а какая пока требует тренировки?

      Не нужно делать идеально. Нам важно попробовать и заметить разницу.

  # ----- Шаблон для следующих постов (скопировать, убрать # в начале строк) -----
  # - day: 1
  #   video: "1.2"
  #   time: "14:00"
  #   text: |
  #     Описание
  #   practice: |
  #     Задание для практики

# ------------------------------------------------------------
#  ПАРЫ ДЛЯ СОВМЕСТНЫХ ЭФИРОВ
#  Бот сохраняет сообщения участников (зашифрованно) и в указанное время присылает
#  ведущей в личку черновик пар. В ветку thread он уходит только после команды /publish.
#  В любой момент можно написать боту /match — подобрать заново, /stats — статистика.
# ------------------------------------------------------------
matching:
  drafts: ["2026-12-05 18:00"]
  thread:        # номер ветки «Знакомства», куда публиковать пары (пусто — ветка «Уроки»)

# ------------------------------------------------------------
#  ЭФИРЫ И ОФЛАЙН-ВСТРЕЧИ — бот пришлёт напоминания
#  datetime  — дата и время начала, в кавычках
#  kind      — эфир / офлайн (влияет только на значок)
#  place     — адрес или площадка (необязательно)
#  link      — ссылка на эфир / регистрацию / карту (необязательно)
#  reminders — когда напомнить: 1d = за день, 3h = за 3 часа, 15m = за 15 минут, 0 = в момент начала.
#              Если не указано, берётся default_reminders.
# ------------------------------------------------------------
default_reminders: [1d, 1h]

events: []
  # Пример (убрать [] выше и # в начале строк):
  # - title: "Эфир «Тема»"
  #   kind: эфир
  #   datetime: "2026-11-26 19:00"
  #   link: "https://…"
  #   reminders: [1d, 1h, 0]
  #   text: "Подключайтесь, готовьте вопросы!"
