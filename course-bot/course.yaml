      🎬 <b>Урок 3. Самый важный вопрос — тот, которого нет в списке</b>

      Представьте: вы подготовили десять отличных вопросов. Гость отвечает на первый — и вдруг рассказывает неожиданную историю.

      А вы уже думаете, как бы не забыть второй вопрос.

      Знакомо?

      Полина объясняет, почему хороший интервьюер должен не только спрашивать, но и по-настоящему слушать.

      🎯 <b>Практика</b>

      В следующем разговоре попробуйте не готовить ответ заранее.

      Дослушайте собеседника и задайте один вопрос, который возник именно из его слов.

      💬 Был ли ответ неожиданным? Расскажите в чате.

  - date: 2026-12-01
    video: "1.5"
    time: "16:00"
    text: |
      🎬 <b>Урок 4. Как задавать вопросы, на которые невозможно ответить одним «да»</b>

      «Вам понравилось открывать бизнес?»

      «Да».

      И разговор закончился, не успев начаться.

      А теперь попробуйте иначе:

      «Что оказалось самым неожиданным, когда вы открыли бизнес?»

      Один вопрос — и перед нами уже может появиться целая история.

      В этом уроке разбираем открытые вопросы и учимся разговорить даже немногословного гостя.

      🎯 <b>Практика</b>

      Переделайте три закрытых вопроса в открытые:

      — Вам нравится ваша работа?
      — Было страшно начинать?
      — Вы довольны результатом?

      💬 Опубликуйте в чате один самый интересный вариант.

  - date: 2026-12-02
    video: "1.6"
    time: "10:00"
    text: |
      🎬 <b>Урок 5. Как одним словом раскрыть целую историю</b>

      Иногда лучший следующий вопрос состоит всего из одного слова.

      Гость: «Это было самое неожиданное решение в моей жизни».

      Ведущий: «Неожиданное?»

      И собеседник начинает объяснять, что именно произошло.

      Это техника эха. Она помогает углублять разговор, не превращая интервью в допрос.

      🎯 <b>Практика</b>

      Сегодня попробуйте применить технику эха в обычном разговоре. Повторите значимое слово собеседника с вопросительной интонацией.

      💬 Расскажите, получилось ли узнать что-то новое.

  - date: 2026-12-02
    video: "1.7"
    time: "14:00"
    text: |
      🎬 <b>Урок 6. Не бойтесь тишины</b>

      В разговоре возникает пауза — и хочется немедленно заполнить её словами.

      Но иногда именно после нескольких секунд тишины человек добавляет самое интересное.

      Полина рассказывает, почему паузы не портят интервью, а помогают сделать его живым.

      🎯 <b>Практика</b>

      В следующем разговоре после ответа собеседника выдержите паузу в 2–3 секунды.

      Не торопитесь задавать новый вопрос.

      💬 Что произошло? Человек продолжил мысль или разговор пошёл дальше?

  - date: 2026-12-02
    video: "1.8"
