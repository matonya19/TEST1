      Можно выучить все техники, подготовить идеальные вопросы и выбрать красивую студию.

      Но если вам неинтересен собеседник, это трудно скрыть.

      В этом уроке Полина рассказывает, почему искреннее любопытство помогает раскрывать людей и как выбирать гостей из смежных сфер.

      🎯 <b>Практика</b>

      Напишите пять профессий или направлений, которые пересекаются с вашей деятельностью.

