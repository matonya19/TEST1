      Перебивать неловко. Но если не остановить разговор, можно потерять тему и время.

      Полина разбирает, как мягко вернуть собеседника к вопросу, не обесценивая его слова.

      💡 <b>Пример</b>

      «Это интересная история, и я хочу к ней вернуться. Но сначала давайте уточним один момент…»

      🎯 <b>Практика</b>

      Придумайте две свои фразы:
      — чтобы остановить слишком длинный ответ;
      — чтобы вернуть гостя к первоначальной теме.

      💬 Поделитесь одной формулировкой в чате.

