function background(t) {
  x.fillStyle = '#03140c'; x.fillRect(0, 0, W, H);
  glow(80 + Math.sin(t * .5) * 40, 760, 540, 'rgba(0,200,90,A)', .55);
  glow(1000, 140 + Math.cos(t * .4) * 40, 440, 'rgba(0,230,200,A)', .45);
  glow(980, 960, 520, 'rgba(30,220,80,A)', .5);
  glow(-40, 120, 380, 'rgba(0,230,190,A)', .35);
  glow(540, 600, 520, 'rgba(0,140,70,A)', .45 + .1 * Math.sin(t * 2));
  for (const d of dust) {
    x.fillStyle = `rgba(200,255,220,${.2 + .5 * (.5 + .5 * Math.sin(t * d.sp * 3 + d.ph))})`;
    x.beginPath(); x.arc(d.x + Math.sin(t * .4 + d.ph) * 8, (d.y - t * 12 * d.sp + H) % H, d.r, 0, TAU); x.fill();
  }
  const v = x.createRadialGradient(540, 540, 380, 540, 540, 800);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,10,5,.55)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
}

// ---------- lime 3D shapes ----------
function limeShade(cx, cy, r) {
  const g = x.createRadialGradient(cx - r * .35, cy - r * .4, r * .05, cx, cy, r * 1.15);
  g.addColorStop(0, '#f2ffc8'); g.addColorStop(.3, '#b8ff3a'); g.addColorStop(.75, '#5fc515'); g.addColorStop(1, '#1f6a08'); return g;
}
function limeBall(cx, cy, r) {
  if (r < 1) return;
  x.save(); x.shadowColor = 'rgba(120,255,60,.5)'; x.shadowBlur = r * .6;
  x.fillStyle = limeShade(cx, cy, r); x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); x.restore();
  x.fillStyle = 'rgba(255,255,255,.8)'; x.beginPath(); x.ellipse(cx - r * .4, cy - r * .45, r * .2, r * .11, -.6, 0, TAU); x.fill();
}
function limePlus(cx, cy, s, rot) {
  if (s < 2) return;
  x.save(); x.translate(cx, cy); x.rotate(rot);
  const a = s * .36, b = s;
  x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 40; x.shadowOffsetY = 20;
  x.fillStyle = '#2f8a0c'; rr(-a, -b, 2 * a, 2 * b, a * .9); x.fill(); rr(-b, -a, 2 * b, 2 * a, a * .9); x.fill();
  x.shadowColor = 'transparent'; x.translate(-s * .05, -s * .07);
  x.fillStyle = limeShade(-s * .1, -s * .1, s * 1.1); rr(-a, -b, 2 * a, 2 * b, a * .9); x.fill(); rr(-b, -a, 2 * b, 2 * a, a * .9); x.fill();
  x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(-a * .3, -b * .62, a * .35, a * .16, 0, 0, TAU); x.fill();
  x.beginPath(); x.ellipse(-b * .62, -a * .3, a * .3, a * .14, 0, 0, TAU); x.fill();
  x.restore();
}

// ---------- diary ----------
const PW = 820, PH = 500;
const COL = [-390, -120, 190, 390];               // column borders (x)
const ROW0 = -140, RH = 85;                        // first row top, row height
const rowY = i => ROW0 + RH * i + RH / 2;
const rows = [
  { subj: 'Математика', task: '№ 245, 247', grade: '2' },
  { subj: 'Русский язык', task: 'упр. 112', grade: '3' },
  { subj: 'Английский', task: 'слова, стр. 40', grade: '2' },
  { subj: 'Физика', task: '§ 14, вопросы', grade: 'Замечание!' },
];
// highlighter swipes: [start, duration]
const SW = [[1.9, .5], [3.5, .5], [4.9, .4], [5.4, .4]];
const swipeP = i => easeInOut(prog(currentT, SW[i][0], SW[i][1]));
let currentT = 0;

function replacement(i, p, t) {
  if (p <= 0) return;
  const s = backOut(p, 2.6);
  const cx = (COL[2] + COL[3]) / 2, cy = rowY(i);
  x.save(); x.translate(cx, cy + 2); x.scale(s, s); x.rotate(-.04);
  x.fillStyle = DG; x.textAlign = 'center'; x.textBaseline = 'middle';
  if (i === 0) { x.font = F(800, 58); x.fillText('−50%', 0, 0); }
  if (i === 1) { x.font = F(800, 58); x.fillText('−20%*', 0, 0); }
  if (i === 2) { x.lineWidth = 11; x.strokeStyle = DG; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(-26, 0); x.lineTo(-6, 20); x.lineTo(30, -22); x.stroke(); }
  if (i === 3) { x.font = F(800, 30); x.fillText('без стресса', 0, 0); }
  x.restore();
}

function diary(t) {
  const ip = easeOut(prog(t, .3, 1.0));
  if (ip <= 0) return;
  const cx = 540, cy = 605 + (1 - ip) * 700 + Math.sin(t * 1.1) * 4;
  x.save(); x.translate(cx, cy); x.rotate(-.035 + (1 - ip) * .25 + Math.sin(t * .8) * .006);
  // page shadow + body
  x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 60; x.shadowOffsetY = 24;
  rr(-PW / 2, -PH / 2, PW, PH, 18); x.fillStyle = '#f7f5ee'; x.fill(); x.shadowColor = 'transparent';
  const pg = x.createLinearGradient(-PW / 2, -PH / 2, PW / 2, PH / 2);
  pg.addColorStop(0, 'rgba(255,255,255,.6)'); pg.addColorStop(1, 'rgba(210,220,205,.35)');
  x.fillStyle = pg; rr(-PW / 2, -PH / 2, PW, PH, 18); x.fill();
  // lime spine / binding on the left
  x.fillStyle = '#7fd63a'; rr(-PW / 2 - 18, -PH / 2 + 10, 30, PH - 20, 10); x.fill();
  x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(-PW / 2 - 12, -PH / 2 + 18, 6, PH - 36);
  // heading
  x.font = F(800, 22); x.fillStyle = '#7b88a6'; x.textBaseline = 'middle'; x.textAlign = 'left';
  if ('letterSpacing' in x) x.letterSpacing = '3px';
  x.fillText('ПОНЕДЕЛЬНИК', COL[0], -212);
  if ('letterSpacing' in x) x.letterSpacing = '0px';
  x.font = CV(40); x.fillStyle = INK; x.textAlign = 'right'; x.fillText('17 ноября', COL[3], -214);
  // header row
  x.font = F(600, 20); x.fillStyle = '#7b88a6'; x.textAlign = 'left';
  x.fillText('Предмет', COL[0] + 6, -165); x.fillText('Что задано', COL[1] + 16, -165);
  x.textAlign = 'center'; x.fillText('Оценка', (COL[2] + COL[3]) / 2, -165);
  // grid
  x.strokeStyle = '#b8c5e2'; x.lineWidth = 2;
  for (let i = 0; i <= rows.length; i++) { x.beginPath(); x.moveTo(COL[0], ROW0 + RH * i); x.lineTo(COL[3], ROW0 + RH * i); x.stroke(); }
  x.beginPath(); x.moveTo(COL[0], -188); x.lineTo(COL[3], -188); x.stroke();
  for (const cxl of [COL[1], COL[2]]) { x.beginPath(); x.moveTo(cxl, -188); x.lineTo(cxl, ROW0 + RH * rows.length); x.stroke(); }
  // footer
  x.font = F(600, 18); x.fillStyle = '#9aa5bf'; x.textAlign = 'left'; x.fillText('Подпись родителей', COL[0], 222);
  x.beginPath(); x.moveTo(COL[0] + 190, 230); x.lineTo(COL[1] + 120, 230); x.stroke();

  rows.forEach((r, i) => {
    const y = rowY(i);
    x.font = CV(44); x.fillStyle = INK; x.textAlign = 'left'; x.textBaseline = 'middle';
    x.fillText(r.subj, COL[0] + 6, y + 2); x.font = CV(40); x.fillText(r.task, COL[1] + 16, y + 2);
    const sp = prog(t, SW[i][0], SW[i][1]);
    // red grade (shakes, then fades under the highlighter)
    const shake = t > 1.3 && t < 1.8 ? Math.sin(t * 60) * .08 : 0;
    const gx = (COL[2] + COL[3]) / 2;
    x.save(); x.translate(gx, y + 2); x.rotate(-.08 + shake); x.globalAlpha = 1 - clamp(sp * 1.4);
    x.fillStyle = RED; x.textAlign = 'center';
    if (r.grade.length === 1) { x.font = CV(86); x.fillText(r.grade, 0, 0);
      x.lineWidth = 4; x.strokeStyle = RED; x.beginPath(); x.ellipse(0, 4, 40, 34, 0, 0, TAU); x.stroke(); }
    else { x.font = CV(36); x.fillText(r.grade, 0, 0); }
    x.restore();
    // highlighter stroke
    if (sp > 0) {
      const e = easeInOut(sp), x0 = COL[2] + 10, x1 = COL[2] + 10 + (COL[3] - COL[2] - 20) * e;
      x.save(); x.globalAlpha = .92; x.fillStyle = LIME;
      x.beginPath(); x.moveTo(x0, y - 30); x.lineTo(x1, y - 33); x.lineTo(x1 - 4, y + 31); x.lineTo(x0 + 4, y + 34); x.closePath(); x.fill();
      x.restore();
    }
    replacement(i, prog(t, SW[i][0] + SW[i][1] * .8, .45), t);
  });

  marker(t);
  x.restore();
}

// highlighter marker, in diary-local coords; tip follows keyframes
const MK = [[1.3, 700, -460], [1.9, COL[2] + 12, rowY(0)], [2.4, COL[3] - 10, rowY(0)], [3.0, COL[3] - 10, rowY(0) - 30],
  [3.5, COL[2] + 12, rowY(1)], [4.0, COL[3] - 10, rowY(1)], [4.4, COL[3] - 10, rowY(1) - 30], [4.9, COL[2] + 12, rowY(2)],
  [5.3, COL[3] - 10, rowY(2)], [5.4, COL[2] + 12, rowY(3)], [5.8, COL[3] - 10, rowY(3)], [6.5, 760, 520]];
function marker(t) {
  if (t < MK[0][0] || t > MK[MK.length - 1][0]) return;
  let k = 0; while (k < MK.length - 2 && t > MK[k + 1][0]) k++;
  const [t0, ax, ay] = MK[k], [t1, bx, by] = MK[k + 1];
  const swipe = SW.some(([s, d]) => Math.abs(s - t0) < .01 && Math.abs(d - (t1 - t0)) < .01);
  const u = swipe ? easeInOut(clamp((t - t0) / (t1 - t0))) : easeInOut(clamp((t - t0) / (t1 - t0)));
  const px = ax + (bx - ax) * u, py = ay + (by - ay) * u;
  x.save(); x.translate(px, py); x.rotate(-.75);
  x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 30; x.shadowOffsetY = 18;
  // chisel tip
  x.fillStyle = '#5fbf12'; x.beginPath(); x.moveTo(0, -12); x.lineTo(34, -20); x.lineTo(34, 20); x.lineTo(0, 12); x.closePath(); x.fill();
  // collar
  x.fillStyle = '#e9efe9'; rr(30, -24, 30, 48, 6); x.fill();
  // body
  const g = x.createLinearGradient(0, -34, 0, 34); g.addColorStop(0, '#e6ffb0'); g.addColorStop(.4, LIME); g.addColorStop(1, '#4ea80e');
  x.fillStyle = g; rr(56, -34, 250, 68, 26); x.fill(); x.shadowColor = 'transparent';
  x.fillStyle = 'rgba(255,255,255,.5)'; rr(70, -26, 220, 12, 6); x.fill();
  x.fillStyle = DG; x.font = F(800, 22); x.textBaseline = 'middle'; x.textAlign = 'center'; x.fillText('SHKOLA', 185, 4);
  x.restore();
}

// ---------- header ----------
const logoImg = document.getElementById('logo');
function header(t) {
  const lp = easeOut(prog(t, 0, .6));
  if (lp > 0) {
    const lw = 270, lh = lw * logoImg.naturalHeight / logoImg.naturalWidth;
    x.save(); x.globalAlpha = lp; x.drawImage(logoImg, 540 - lw / 2, 38 - (1 - lp) * 20, lw, lh); x.restore();
  }
  const tp = prog(t, .15, .6);
  if (tp > 0) {
    const s = backOut(tp, 1.8);
    x.save(); x.translate(540, 190); x.scale(s, s); x.globalAlpha = clamp(tp * 2);
    x.font = F(800, 86); x.textAlign = 'center'; x.textBaseline = 'middle';
    x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 30; x.shadowOffsetY = 8;
    x.fillStyle = '#fff'; x.fillText('Чёрная пятница', 0, 0); x.restore();
  }
  const sp = prog(t, .5, .5);
  if (sp > 0) {
    x.save(); x.globalAlpha = sp; x.translate(540, 262 + (1 - easeOut(sp)) * 14); x.textBaseline = 'middle';
    const a = 'Скидки до 50%', b = `  ·  только до ${DATE} ноября`;
    x.font = F(800, 38); const wa = x.measureText(a).width; x.font = F(600, 34); const wb = x.measureText(b).width;
    const sx = -(wa + wb) / 2; x.textAlign = 'left';
    x.font = F(800, 38); x.fillStyle = LIME; x.shadowColor = 'rgba(168,245,44,.45)'; x.shadowBlur = 18; x.fillText(a, sx, 0);
    x.shadowBlur = 0; x.font = F(600, 34); x.fillStyle = '#fff'; x.fillText(b, sx + wa, 2);
    x.restore();
  }
}

// ---------- caption slot / CTA ----------
const CAPS = [[1.0, 2.4, '', 'Двойки, замечания, стресс…'], [2.4, 4.0, '−50%', ' на первый месяц обучения'],
  [4.0, 5.8, '−20%', ' на пакеты репетиторства*'], [5.8, 6.8, '', 'Мини-классы до 8 человек']];
function caption(t) {
  for (const [s, e, a, b] of CAPS) {
    if (t < s || t > e) continue;
    const pin = easeOut(clamp((t - s) / .35)), pout = easeInOut(clamp((t - (e - .3)) / .3));
    x.save(); x.globalAlpha = pin * (1 - pout); x.translate(540 + (1 - pin) * 80 - pout * 80, 940);
    x.font = F(800, 36); const wa = a ? x.measureText(a).width : 0; x.font = F(600, 34); const wb = x.measureText(b).width;
    const w = wa + wb + 90, h = 76;
    rr(-w / 2, -h / 2, w, h, h / 2); x.fillStyle = 'rgba(8,45,26,.8)'; x.fill();
    x.lineWidth = 2; x.strokeStyle = 'rgba(168,245,44,.75)'; x.stroke();
    x.textAlign = 'left'; x.textBaseline = 'middle'; let sx = -(wa + wb) / 2;
    if (a) { x.font = F(800, 36); x.fillStyle = LIME; x.fillText(a, sx, 2); sx += wa; }
    x.font = F(600, 34); x.fillStyle = '#fff'; x.fillText(b, sx, 2);
    x.restore();
  }
}
function pill(cx, cy, w, h, alpha) {
  x.save(); x.globalAlpha = alpha;
  x.shadowColor = 'rgba(168,245,44,.6)'; x.shadowBlur = 36;
  rr(cx - w / 2, cy - h / 2, w, h, h / 2);
  const g = x.createLinearGradient(0, cy - h / 2, 0, cy + h / 2); g.addColorStop(0, '#d2ff7a'); g.addColorStop(.5, LIME); g.addColorStop(1, '#79d10f');
  x.fillStyle = g; x.fill(); x.shadowBlur = 0;
  rr(cx - w / 2 + 16, cy - h / 2 + 6, w - 32, h * .36, h * .18); x.fillStyle = 'rgba(255,255,255,.35)'; x.fill();
  x.font = F(800, 34); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = DG;
  x.fillText('Записаться на пробный урок', cx, cy + 2);
  x.restore();
}
function cta(t) {
  const p = prog(t, 8.9, .5); if (p <= 0) return;
  const sc = backOut(p, 2) * (1 + .02 * Math.sin(t * 5));
  x.save(); x.translate(540, 940); x.scale(sc, sc); pill(0, 0, 700, 94, clamp(p * 2)); x.restore();
  // shine sweep across the button
  const sh = prog(t, 9.6, .8);
  if (sh > 0 && sh < 1) { x.save(); rr(190, 893, 700, 94, 47); x.clip(); x.translate(190 + sh * 900 - 100, 0); x.rotate(.3);
    x.fillStyle = 'rgba(255,255,255,.45)'; x.fillRect(-30, 700, 50, 500); x.restore(); }
}
function footnote(t) {
  const p = prog(t, 4.0, .5); if (p <= 0) return;
  const hide = 1 - prog(t, 6.8, .2) + prog(t, 8.8, .3);
  x.save(); x.globalAlpha = .7 * p * clamp(hide); x.font = F(600, 22); x.textAlign = 'center'; x.fillStyle = '#d8ffe6';
  x.fillText('*скидка не распространяется на пакет «Макси»', 540, 1048); x.restore();
}

// ---------- big statement overlay ----------
function statement(t) {
  const a = prog(t, 6.8, .35) * (1 - prog(t, 8.6, .35));
  if (a <= 0) return;
  x.save(); x.globalAlpha = a; x.fillStyle = 'rgba(2,16,9,.86)'; x.fillRect(0, 0, W, H); x.restore();
  glow(540, 560, 480, 'rgba(0,200,90,A)', .35 * a);
  const L = [['Без оценок.', '#fff', 7.0, 400], ['Без стресса.', '#fff', 7.3, 545], ['Со скидкой до 50%', LIME, 7.6, 700]];
  for (const [s, col, st, y] of L) {
    const p = prog(t, st, .45); if (p <= 0) continue;
    const out = prog(t, 8.5, .35);
    x.save(); x.globalAlpha = clamp(p * 2) * (1 - out); x.translate(540 - out * 60, y); const k = backOut(p, 2); x.scale(k, k);
    x.font = F(800, col === LIME ? 80 : 94); x.textAlign = 'center'; x.textBaseline = 'middle';
    if (col === LIME) { x.shadowColor = 'rgba(168,245,44,.6)'; x.shadowBlur = 26; }
    x.fillStyle = col; x.fillText(s, 0, 0);
    if (col !== LIME) { // lime highlighter underline
      const w = x.measureText(s).width, u = easeInOut(prog(t, st + .25, .4));
      x.globalAlpha *= .9; x.fillStyle = LIME; x.fillRect(-w / 2, 52, w * u, 12);
    }
    x.restore();
  }
}

function draw(t) {
  currentT = t;
  x.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  // floating lime decor
  limePlus(1010, 470 + Math.sin(t * 1.2) * 12, 80 * elastic(prog(t, .9, .9)), .2 + t * .1);
  limePlus(70, 980 + Math.cos(t) * 10, 95 * elastic(prog(t, 1.1, .9)), -.3 - t * .08);
  limeBall(85, 400 + Math.sin(t * 1.3) * 12, 30 * elastic(prog(t, 1.0, .8)));
  limeBall(975, 860 + Math.cos(t * 1.1) * 10, 24 * elastic(prog(t, 1.3, .8)));
  limeBall(1000, 300 + Math.cos(t * 1.4) * 8, 14 * elastic(prog(t, 1.4, .8)));
  diary(t);
  header(t);
  caption(t);
  footnote(t);
  statement(t);
  cta(t);
}
window.DUR = DUR;
window.drawAt = t => draw(t);
window.ready = Promise.all([document.fonts.load(F(800, 40), 'Чёрная SHKOLA'), document.fonts.load(F(600, 40), 'Предмет'),
  document.fonts.load(CV(40), 'Математика 0123456789 №§,.!'), document.fonts.load(F(800, 40), '0123456789%−*'), document.fonts.load(F(600, 40), '0123456789·'), logoImg.decode()]).then(() => { draw(0); return true; });
</script></body></html>
