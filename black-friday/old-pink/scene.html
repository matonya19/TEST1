<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/unbounded/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/montserrat/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/caveat/700.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
const P = new URLSearchParams(location.search);
const DATE = P.get('date') || '';           // e.g. "30" -> "ТОЛЬКО ДО 30 НОЯБРЯ"
const W = 1080, H = 1080, DUR = 9;
const c = document.getElementById('c'), x = c.getContext('2d');

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const backOut = (p, s = 1.9) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const elastic = p => p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI) / 3) + 1;
const TAU = Math.PI * 2;
// deterministic random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const UNB = '900 {s}px Unbounded', MON = '800 {s}px Montserrat', CAV = '700 {s}px Caveat';
const font = (f, s) => f.replace('{s}', s);

function roundRect(px, py, w, h, r) {
  x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath();
}

// ---------- background ----------
const stars = Array.from({ length: 70 }, () => ({ x: rnd() * W, y: rnd() * H, r: .6 + rnd() * 2.2, ph: rnd() * TAU, sp: .5 + rnd() * 2, dark: rnd() < .45 }));
function background(t) {
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050109'); g.addColorStop(.32, '#1c0626'); g.addColorStop(.62, '#7a0f5e'); g.addColorStop(.85, '#d61f86'); g.addColorStop(1, '#2a0420');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // hot glow behind the sphere
  const pulse = .85 + .15 * Math.sin(t * 2.2);
  const rg = x.createRadialGradient(540, 640, 40, 540, 640, 620);
  rg.addColorStop(0, `rgba(255,70,190,${.55 * pulse})`); rg.addColorStop(.5, 'rgba(160,30,160,.25)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = rg; x.fillRect(0, 0, W, H);
  // orbit rings
  x.save(); x.translate(540, 620);
  for (let i = 0; i < 4; i++) {
    x.save(); x.rotate(-.35 + i * .5 + t * .06 * (i % 2 ? 1 : -1));
    x.beginPath(); x.ellipse(0, 0, 330 + i * 70, 130 + i * 40, 0, 0, TAU);
    x.strokeStyle = `rgba(255,190,240,${.16 - i * .025})`; x.lineWidth = 2; x.stroke(); x.restore();
  }
  x.restore();
  for (const s of stars) {
    const a = .35 + .65 * (.5 + .5 * Math.sin(t * s.sp * 2 + s.ph));
    x.fillStyle = s.dark ? `rgba(20,0,25,${a * .8})` : `rgba(255,235,250,${a * .7})`;
    x.beginPath(); x.arc(s.x + Math.sin(t * .5 + s.ph) * 6, s.y - (t * 8 * s.sp) % 40, s.r, 0, TAU); x.fill();
  }
}

// ---------- glossy sphere ----------
function sphere(cx, cy, r, kind) {
  x.save();
  // glow
  const gl = x.createRadialGradient(cx, cy, r * .7, cx, cy, r * 1.45);
  gl.addColorStop(0, kind === 'main' ? 'rgba(255,80,200,.45)' : 'rgba(255,60,120,.4)'); gl.addColorStop(1, 'rgba(255,60,180,0)');
  x.fillStyle = gl; x.beginPath(); x.arc(cx, cy, r * 1.45, 0, TAU); x.fill();
  x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.clip();
  let g = x.createRadialGradient(cx + r * .2, cy - r * .1, r * .05, cx, cy, r);
  if (kind === 'main') {
    g.addColorStop(0, '#0c0118'); g.addColorStop(.55, '#250850'); g.addColorStop(.82, '#6a25d0'); g.addColorStop(1, '#ff5ad0');
  } else if (kind === 'red') {
    g.addColorStop(0, '#ff7fb0'); g.addColorStop(.5, '#f0306e'); g.addColorStop(.85, '#b0104a'); g.addColorStop(1, '#ff9ad0');
  } else { // violet mini
    g.addColorStop(0, '#3a0d6e'); g.addColorStop(.7, '#7c3cf0'); g.addColorStop(1, '#ffa0ff');
  }
  x.fillStyle = g; x.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  if (kind === 'red') { // stripes like a candy ball
    x.save(); x.translate(cx, cy); x.rotate(-.6); x.globalAlpha = .22; x.fillStyle = '#fff';
    for (let i = -5; i <= 5; i++) { x.beginPath(); x.ellipse(i * r * .32, 0, r * .07, r * 1.1, 0, 0, TAU); x.fill(); }
    x.restore();
  }
  // pink rim bottom-left
  const rim = x.createRadialGradient(cx - r * .55, cy + r * .65, 0, cx - r * .55, cy + r * .65, r * 1.0);
  rim.addColorStop(0, 'rgba(255,90,210,.85)'); rim.addColorStop(1, 'rgba(255,90,210,0)');
  x.fillStyle = rim; x.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  // blue rim top-right
  const rim2 = x.createRadialGradient(cx + r * .7, cy - r * .55, 0, cx + r * .7, cy - r * .55, r * .8);
  rim2.addColorStop(0, 'rgba(120,120,255,.55)'); rim2.addColorStop(1, 'rgba(120,120,255,0)');
  x.fillStyle = rim2; x.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  x.restore();
  // specular
  x.save(); x.translate(cx - r * .38, cy - r * .45); x.rotate(-.6);
  const sp = x.createRadialGradient(0, 0, 0, 0, 0, r * .38);
  sp.addColorStop(0, 'rgba(255,255,255,.75)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = sp; x.scale(1, .55); x.beginPath(); x.arc(0, 0, r * .38, 0, TAU); x.fill(); x.restore();
  x.fillStyle = 'rgba(255,255,255,.9)'; x.beginPath(); x.arc(cx - r * .5, cy - r * .52, r * .045, 0, TAU); x.fill();
  // thin edge
  x.strokeStyle = 'rgba(255,200,255,.35)'; x.lineWidth = Math.max(1, r * .012); x.beginPath(); x.arc(cx, cy, r - 1, 0, TAU); x.stroke();
}

// 3D glossy text (extruded)
function glossyText(str, px, py, size, opts = {}) {
  x.save(); x.translate(px, py); x.rotate(opts.rot || 0); x.transform(1, 0, opts.skew ?? -.18, 1, 0, 0);
  x.font = font(UNB, size); x.textAlign = 'center'; x.textBaseline = 'middle';
  const depth = opts.depth ?? Math.round(size * .09);
  for (let i = depth; i > 0; i--) { x.fillStyle = i > depth * .5 ? '#5a0a4a' : '#b0177a'; x.fillText(str, i * .6, i); }
  const g = x.createLinearGradient(0, -size * .5, 0, size * .5);
  (opts.colors || ['#ffffff', '#ffc2ec', '#ff5cc6']).forEach((col, i, a) => g.addColorStop(i / (a.length - 1), col));
  x.fillStyle = g; x.shadowColor = 'rgba(255,120,220,.7)'; x.shadowBlur = size * .15; x.fillText(str, 0, 0);
  x.shadowBlur = 0; x.globalAlpha = .35; x.fillStyle = '#fff'; x.save(); x.beginPath(); x.rect(-2000, -size * .55, 4000, size * .32); x.clip(); x.fillText(str, 0, 0); x.restore();
  x.restore();
}

// ---------- title ----------
function title(t) {
  const lines = [
    { s: 'ЧЁРНАЯ', y: 108, size: 84, skew: 0, d: 0.05 },
    { s: 'ПЯТНИЦА', y: 200, size: 84, skew: 0, d: 0.2 },
    { s: 'В SHKOLA', y: 308, size: 112, skew: -.28, d: 0.35 },
  ];
  for (const L of lines) {
    const p = prog(t, L.d, .55); if (p <= 0) continue;
    const sc = backOut(p, 2.4), a = clamp(p * 2);
    x.save(); x.translate(540, L.y); x.scale(sc, sc); x.transform(1, 0, L.skew, 1, 0, 0); x.globalAlpha = a;
    x.font = font(UNB, L.size); x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineJoin = 'round'; x.lineWidth = 10; x.strokeStyle = 'rgba(10,0,20,.55)'; x.strokeText(L.s, 4, 6);
    x.fillStyle = '#fff'; x.shadowColor = 'rgba(255,90,210,.55)'; x.shadowBlur = 24; x.fillText(L.s, 0, 0);
    x.restore();
  }
  // subtitle
  const p = prog(t, .9, .5);
  if (p > 0) {
    const sub = DATE ? `ТОЛЬКО ДО ${DATE} НОЯБРЯ` : 'СТАРТОВАЛА!  ВЫГОДА ДО 50%';
    x.save(); x.globalAlpha = p; x.translate(540, 382 + (1 - easeOut(p)) * 20);
    x.font = font(MON, 28); x.textAlign = 'center'; x.textBaseline = 'middle';
    if ('letterSpacing' in x) x.letterSpacing = '3px';
    const w = x.measureText(sub).width + 50;
    roundRect(-w / 2, -24, w, 48, 24); x.fillStyle = 'rgba(255,60,180,.22)'; x.fill();
    x.strokeStyle = 'rgba(255,170,230,.6)'; x.lineWidth = 2; x.stroke();
    x.fillStyle = '#ffe3f6'; x.fillText(sub, 0, 2); x.restore();
  }
}

// ---------- handwritten notes ----------
function note(t, start, str, px, py, rot, arrow) {
  const p = prog(t, start, .45); if (p <= 0) return;
  const wob = Math.sin(t * 3 + px) * .02;
  x.save(); x.translate(px, py); x.rotate(rot + wob); x.scale(backOut(p, 2.2), backOut(p, 2.2)); x.globalAlpha = clamp(p * 2);
  x.font = font(CAV, 50); x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 8; x.strokeStyle = 'rgba(40,0,40,.55)'; x.strokeText(str, 2, 3);
  x.fillStyle = '#ff8ae0'; x.shadowColor = 'rgba(255,80,200,.8)'; x.shadowBlur = 12; x.fillText(str, 0, 0);
  x.restore();
  if (arrow) { // hand-drawn arrow, drawn progressively
    const q = easeOut(prog(t, start + .2, .5)); if (q <= 0) return;
    const [ax, ay, bx, by, bend] = arrow;
    const mx = (ax + bx) / 2 + bend, my = (ay + by) / 2 - Math.abs(bend) * .4;
    x.save(); x.strokeStyle = '#ff8ae0'; x.lineWidth = 5; x.lineCap = 'round';
    x.shadowColor = 'rgba(255,80,200,.8)'; x.shadowBlur = 8;
    const N = 30, n = Math.floor(N * q);
    x.beginPath();
    let ex = ax, ey = ay, px2 = ax, py2 = ay;
    for (let i = 0; i <= n; i++) { const u = i / N; px2 = ex; py2 = ey; ex = (1 - u) * (1 - u) * ax + 2 * u * (1 - u) * mx + u * u * bx; ey = (1 - u) * (1 - u) * ay + 2 * u * (1 - u) * my + u * u * by; i ? x.lineTo(ex, ey) : x.moveTo(ex, ey); }
    x.stroke();
    if (q > .95) { const ang = Math.atan2(ey - py2, ex - px2); x.beginPath();
      x.moveTo(ex - 22 * Math.cos(ang - .5), ey - 22 * Math.sin(ang - .5)); x.lineTo(ex, ey); x.lineTo(ex - 22 * Math.cos(ang + .5), ey - 22 * Math.sin(ang + .5)); x.stroke(); }
    x.restore();
  }
}

// ---------- CTA button with stacked echo ----------
function pill(cx, cy, w, h, alpha, label) {
  x.save(); x.globalAlpha = alpha;
  x.shadowColor = 'rgba(120,70,255,.8)'; x.shadowBlur = 30;
  roundRect(cx - w / 2, cy - h / 2, w, h, h / 2);
  const g = x.createLinearGradient(0, cy - h / 2, 0, cy + h / 2); g.addColorStop(0, '#9a72ff'); g.addColorStop(.5, '#6c3cff'); g.addColorStop(1, '#4a1fd8');
  x.fillStyle = g; x.fill(); x.shadowBlur = 0;
  x.lineWidth = 3; x.strokeStyle = 'rgba(210,190,255,.85)'; x.stroke();
  roundRect(cx - w / 2 + 14, cy - h / 2 + 6, w - 28, h * .38, h * .2); x.fillStyle = 'rgba(255,255,255,.18)'; x.fill();
  if (label) { x.font = font(MON, 34); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.fillText(label, cx, cy + 2); }
  x.restore();
}
function cta(t) {
  const p = prog(t, 1.6, .5); if (p <= 0) return;
  const cx = 540, cy = 960, w = 720, h = 96;
  // echo stacks at 2 moments
  for (const T0 of [2.0, 6.2]) {
    const e = prog(t, T0, .9);
    if (e > 0 && e < 1) for (let k = 3; k >= 1; k--) {
      const off = (1 - easeInOut(e)) * k;
      pill(cx - off * 34, cy - off * 46, w - 20, h, .55 * (1 - e * .6), 'Записаться на пробный урок');
    }
  }
  const sc = backOut(p, 2) * (1 + .025 * Math.sin(t * 5));
  x.save(); x.translate(cx, cy); x.scale(sc, sc); x.translate(-cx, -cy);
  pill(cx, cy, w, h, clamp(p * 2), 'Записаться на пробный урок');
  x.restore();
  // footnote
  x.save(); x.globalAlpha = .7 * clamp(p * 2); x.font = font(MON, 22); x.textAlign = 'center'; x.fillStyle = '#ffd9f1';
  x.fillText('*скидка не распространяется на пакет «Макси»', 540, 1050); x.restore();
}

// ---------- mini bubbles ----------
const minis = [
  { x: 95, y: 590, r: 44, k: 'red', l: '%', d: .9 },
  { x: 995, y: 545, r: 38, k: 'violet', l: '📚', d: 1.1 },
  { x: 80, y: 775, r: 34, k: 'violet', l: '🔥', d: 1.3 },
  { x: 300, y: 830, r: 26, k: 'red', l: '%', d: 1.5 },
  { x: 1030, y: 905, r: 28, k: 'red', l: '★', d: 1.2 },
  { x: 470, y: 885, r: 20, k: 'violet', l: '%', d: 1.4 },
  { x: 40, y: 690, r: 16, k: 'red', l: '', d: 1.6 },
];
function minisDraw(t) {
  minis.forEach((m, i) => {
    const p = prog(t, m.d, .6); if (p <= 0) return;
    const s = elastic(p);
    const mx = m.x + Math.sin(t * 1.3 + i) * 12, my = m.y + Math.cos(t * 1.1 + i * 2) * 14;
    const r = m.r * s; if (r < 1) return;
    sphere(mx, my, r, m.k);
    if (m.l) { x.save(); x.font = m.l.length > 1 ? `${r * .9}px "Noto Color Emoji"` : font(UNB, r * .9); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.fillText(m.l, mx, my + r * .05); x.restore(); }
  });
}

// ---------- main composition ----------
function draw(t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, W, H);
  background(t);
  // gentle camera push-in
  const z = 1 + .035 * easeInOut(clamp(t / DUR));
  x.translate(540, 560); x.scale(z, z); x.translate(-540, -560);

  minisDraw(t);

  // big sphere -50%
  const bp = prog(t, .45, 1.1);
  if (bp > 0) {
    const s = elastic(bp);
    const cx = 520 + Math.sin(t * 1.2) * 8, cy = 630 + Math.cos(t * 1.4) * 10, r = 215 * s;
    sphere(cx, cy, r, 'main');
    const tp = prog(t, .95, .6);
    if (tp > 0) {
      const ts = backOut(tp, 2.6);
      x.save(); x.translate(cx, cy - 10); x.scale(ts, ts);
      glossyText('−50%', 0, 0, 132, { rot: -.12 + Math.sin(t * 1.6) * .03 });
      x.restore();
      x.save(); x.globalAlpha = tp; x.font = font(MON, 26); x.textAlign = 'center'; x.fillStyle = '#ffe6f7';
      x.translate(cx, cy + 112); x.rotate(-.05);
      x.fillText('НА ПЕРВЫЙ МЕСЯЦ', 0, 0); x.restore();
    }
  }
  // small sphere -20%
  const sp = prog(t, 1.15, 1.0);
  if (sp > 0) {
    const s = elastic(sp), ang = t * .7;
    const cx = 830 + Math.cos(ang) * 14, cy = 700 + Math.sin(ang) * 18, r = 112 * s;
    sphere(cx, cy, r, 'red');
    x.save(); x.translate(cx, cy); x.scale(s, s);
    glossyText('−20%', 0, -4, 50, { rot: .22, skew: -.15, colors: ['#ffffff', '#ffe0ef', '#ffb0d6'], depth: 5 });
    x.restore();
  }

  // notes
  note(t, 2.2, 'без оценок!!!', 190, 455, -.14, [200, 490, 310, 560, -40]);
  note(t, 3.0, 'и без стресса', 200, 870, -.06, null);
  note(t, 3.8, 'мини-классы до 8!', 820, 470, .1, null);
  note(t, 4.6, 'на репетиторство*', 840, 850, .07, null);

  // "учёба вдохновляет" ring note around sphere bottom-left
  const rp = easeOut(prog(t, 5.2, .7));
  if (rp > 0) {
    x.save(); x.translate(520, 630); x.rotate(-.3);
    x.beginPath(); x.ellipse(0, 0, 270, 250, 0, Math.PI * .55, Math.PI * .55 + Math.PI * 1.1 * rp);
    x.strokeStyle = 'rgba(255,140,224,.8)'; x.lineWidth = 4; x.setLineDash([2, 12]); x.lineCap = 'round'; x.stroke(); x.restore();
  }

  title(t);
  // CTA drawn without camera zoom so it stays crisp in frame
  x.setTransform(1, 0, 0, 1, 0, 0);
  cta(t);

  // fade at the very end for a smooth loop
  const f = 0;
  if (f > 0) { x.fillStyle = `rgba(5,1,9,${f})`; x.fillRect(0, 0, W, H); }
}
window.DUR = DUR;
window.drawAt = t => { draw(t); };
window.ready = document.fonts.load(font(UNB, 40), 'ЧЁРНАЯ SHKOLA').then(() => Promise.all([
  document.fonts.load(font(MON, 30), 'Записаться'), document.fonts.load(font(CAV, 40), 'без оценок'),
  document.fonts.load('40px "Noto Color Emoji"', '📚🔥')])).then(() => { draw(0); return true; });
</script></body></html>
