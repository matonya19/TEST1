<title>SMM-пульт</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: left rail with clients (desktop) / sticky chip rail on top (phone) + one work column */
:root{
  --bg:#e4e7ef; --surface:#ffffff; --ink:#141824; --muted:#4f5668; --line:#cdd2de; --soft:#eef0f5;
  --rail-bg:#171b2e; --rail-ink:#f2f4fb; --rail-muted:#a3aac0; --rail-hover:#252a44;
  --accent:#3b4cf0; --accent-ink:#ffffff; --accent-soft:#eceefe;
  --ok:#1d7a4a; --warn:#a9520a; --bad:#b42336;
  --c-ulyana:#9c6e34; --c-school:#1238f0; --c-natalia:#1f8fe0; --c-keystone:#141414; --c-roombloom:#14a08a; --c-inbox:#6b7280;
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Montserrat",system-ui,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(20,24,36,.08),0 6px 18px rgba(20,24,36,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e13; --surface:#1c2029; --ink:#f1f3f8; --muted:#a3aab9; --line:#343a48; --soft:#262b36; --shadow:none;
  --rail-bg:#05060a; --rail-ink:#f1f3f8; --rail-muted:#8d94a6; --rail-hover:#1c2029;
  --accent:#8b96ff; --accent-ink:#0d1030; --accent-soft:#252a4a;
  --ok:#4cc488; --warn:#f0a050; --bad:#f07a8a;
  --c-ulyana:#d4ad72; --c-school:#6f8bff; --c-natalia:#6fc0f5; --c-keystone:#3a3a3a; --c-roombloom:#5fd6c0; --c-inbox:#9ca3af;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e13; --surface:#1c2029; --ink:#f1f3f8; --muted:#a3aab9; --line:#343a48; --soft:#262b36; --shadow:none;
  --rail-bg:#05060a; --rail-ink:#f1f3f8; --rail-muted:#8d94a6; --rail-hover:#1c2029;
  --accent:#8b96ff; --accent-ink:#0d1030; --accent-soft:#252a4a;
  --ok:#4cc488; --warn:#f0a050; --bad:#f07a8a;
  --c-ulyana:#d4ad72; --c-school:#6f8bff; --c-natalia:#6fc0f5; --c-keystone:#3a3a3a; --c-roombloom:#5fd6c0; --c-inbox:#9ca3af;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--rail-bg);color:var(--rail-ink);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.02em;padding:4px 10px 16px}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--rail-muted);letter-spacing:0}
.rail-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--rail-muted);padding:16px 12px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap;color:var(--rail-ink)}
.nav:hover{background:var(--rail-hover)}
.nav[aria-current="true"]{background:var(--accent);color:#fff;font-weight:700}
.nav[aria-current="true"] .cnt{color:#fff}
.nav[aria-current="true"] .glyph{border-color:#fff}
.nav[aria-current="true"] .dot{box-shadow:0 0 0 2px #fff}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--rail-muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--cc,var(--c-inbox))}
.nav .glyph{width:10px;height:10px;flex:none;border:2px solid var(--rail-muted);border-radius:3px}

main{min-width:0;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail-bg)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:auto;flex-direction:row;align-items:center;overflow-x:auto;
    padding-block:8px;padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .brand,.rail-label{display:none}
  .nav{width:auto;padding:7px 13px;border:1px solid #ffffff2e;border-radius:999px;font-size:14px}
  .nav[aria-current="true"]{border-color:var(--accent)}
  .nav .cnt{margin-left:2px}
  main{padding-block:18px 120px}
  .wrap{gap:22px}
}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.6vw,30px);letter-spacing:-.025em;line-height:1.2}
.head .sub{color:var(--muted);margin-top:4px}
.head .grow{flex:1 1 260px;min-width:0}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.01em}

section{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.015em}
.sec-h .hint{color:var(--muted);font-size:13px;font-weight:500}
.sec-h .sp{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.empty{color:var(--muted);font-size:14px;padding:16px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--cc,var(--accent));border-color:var(--cc,var(--accent));color:#fff}
.btn.solid:hover{filter:brightness(1.08)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);font-weight:700}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow)}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px;white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--soft)}
.seg button[aria-selected="true"]{color:#fff;background:var(--cc,var(--accent))}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .body{flex:1;min-width:0;cursor:pointer}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:12.5px;margin-top:2px;align-items:center}
.chk{appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;margin-top:2px;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag .dot{width:7px;height:7px}
.tag.late{background:none;color:var(--bad);padding:0}
.plat{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;color:#fff;white-space:nowrap;letter-spacing:.01em;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.plat-ig{background:linear-gradient(90deg,#f58529,#dd2a7b 55%,#8134af)}
.plat-yt{background:#e62117}
.plat-tg{background:#229ed9}
.plat-th{background:#111;outline:1px solid #ffffff33}
.fchip .plat{margin-right:2px}
.svc{flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--ink);margin-top:2px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink)}
.lacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
@media (max-width:640px){.row:has(.lacts){flex-wrap:wrap}.row .lacts{width:100%;justify-content:flex-start;padding-left:0}}
.studio{background:var(--bg);width:min(1320px,100%);height:min(100%,940px);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.st-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.st-head .ico{width:38px;height:34px}
.st-title{flex:1 1 260px;min-width:0;font-weight:600}
.st-acts{display:flex;gap:8px;flex-wrap:wrap}
.st-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.st-prev{overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-content:start}
.st-prev figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.st-prev canvas{width:100%;height:auto;aspect-ratio:4/5;border-radius:10px;box-shadow:var(--shadow);background:var(--soft);display:block}
.st-prev figcaption{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.st-edit{overflow:auto;padding:18px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:14px}
.st-slide{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.st-sh{display:flex;align-items:center;gap:4px;font-size:13px}.st-sh span{color:var(--muted)}.st-sh .sp{flex:1}
.st-slide textarea{resize:vertical}
.st-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.st-row select{flex:1 1 160px;padding:7px 10px}
@media (max-width:860px){
  .overlay:has(.studio){padding:0;align-items:stretch}
  .studio{border-radius:0;height:100%;width:100%}
  .st-head{padding-top:max(12px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .st-acts{width:100%}.st-acts .btn{flex:1 1 auto;justify-content:center}
  .st-body{display:block;overflow:auto}
  .st-prev{display:flex;overflow-x:auto;padding:14px 16px;scroll-snap-type:x mandatory}
  .st-prev figure{flex:0 0 64%;scroll-snap-align:start}
  .st-edit{overflow:visible;border-left:0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:16px}
.ccard{border:0;padding:0;background:none;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard img{width:100%;aspect-ratio:4/5;border-radius:12px;box-shadow:var(--shadow);background:var(--soft);display:block;object-fit:cover}
.ccard:hover img{outline:2px solid var(--cc,var(--accent));outline-offset:2px}
.ccard .ct{font-weight:600;font-size:14px;overflow-wrap:anywhere}.ccard .cm{font-size:12px;color:var(--muted)}
.tag.claude{background:var(--accent-soft);color:var(--ink)}
.st-todo{color:var(--muted)} .st-doing{color:var(--warn)} .st-done{color:var(--ok)}
.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;color:var(--muted);font-size:14px;margin-top:4px;overflow-wrap:anywhere}

/* client cards on the week */
.cc{display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.cc::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--cc)}
.cc h3{font-family:var(--f-display);font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.cc .desc{color:var(--muted);font-size:13px;margin-top:2px}
.nums{display:flex;gap:18px}
.nums div{display:flex;flex-direction:column}
.nums b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.mini label .chk{width:17px;height:17px;margin-top:1px}

/* quick capture */
.qc{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.qc input[type=text]{flex:1 1 280px;min-width:0}
.field,.qc input,.qc select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px}
.field:focus,.qc input:focus,.qc select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* content plan */
.plan-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.plan-bar .range{font-weight:700;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.fchip[aria-pressed="false"]{opacity:.45}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:150px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.day-h b{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.day-h span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.post{border:0;text-align:left;background:var(--soft);border-left:3px solid var(--cc);border-radius:8px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.post .pt{font-size:13px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.post .pm{font-size:11.5px;color:var(--muted)}
.post.done .pt{text-decoration:line-through;color:var(--muted)}
.add-day{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:6px;padding:4px;color:var(--muted);cursor:pointer;font-size:13px}
.add-day:hover{color:var(--ink);border-color:var(--muted)}
@media (max-width:860px){
  .week{grid-template-columns:minmax(0,1fr)}
  .day{min-height:0}
  .day .add-day{align-self:flex-start;padding:4px 10px}
}
.agenda{display:flex;flex-direction:column;gap:10px}
.agenda .ad{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start}
.agenda .ad-d{font-weight:700;padding-top:6px}
.agenda .ad-d span{display:block;color:var(--muted);font-weight:500;font-size:12px}
.agenda .ad-p{display:flex;flex-direction:column;gap:6px}

/* client header */
.chead{border-left:6px solid var(--cc);padding-left:16px}
.ico{display:inline-grid;place-items:center;flex:none;color:#fff;background:var(--cc);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.ico svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav .ico{width:22px;height:20px}
.ava{flex:none;border-radius:50%;background-color:var(--soft);background-repeat:no-repeat;display:block}
.cc-top{display:flex;gap:12px;align-items:center}
.cc-top .ico{width:44px;height:40px}
.cc-top .ava{width:44px;height:44px;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--cc)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;min-height:150px;display:flex;align-items:center;gap:20px;
  background:var(--h-bg);color:var(--h-ink);box-shadow:var(--shadow)}
.hero .art{position:absolute;inset:0;pointer-events:none}
.hero .art svg{position:absolute;color:var(--h-line)}
.hero .ico{width:64px;height:58px;background:var(--h-tile);color:var(--h-tile-ink)!important;position:relative}
.hero .txt{position:relative;flex:1;min-width:0}
.hero h1{font-weight:700;font-size:clamp(22px,3.6vw,32px);letter-spacing:-.02em;line-height:1.15;color:var(--h-ink)}
.hero .sub{color:var(--h-sub);margin-top:4px;font-weight:500}
.hero .rule{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--h-ink);opacity:.55;max-width:240px}
.hero .rule i{flex:1;height:1px;background:currentColor}.hero .rule b{width:6px;height:6px;border-radius:50%;background:currentColor}
.hero-min{border:1px solid #e3e3e0}
.hero-min h1{font-weight:400;text-transform:uppercase;letter-spacing:.2em;font-size:clamp(20px,3vw,28px)}
.hero-min .sub{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:500}
.hero-min .rule{opacity:.9;max-width:64px}.hero-min .rule b,.hero-min .rule b+i{display:none}
.hero-min .addpic{background:#fff;border-color:#c8c8c4}
.hero-rb{border:0}.hero-rb .addpic{background:#ffffff40;border-color:#1e262655}
.hero-rb .ico svg{stroke-width:1.4}
.hero .pic{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero .pic .ava{width:128px;height:128px;box-shadow:0 0 0 4px #ffffffcc,0 10px 30px rgba(10,40,90,.25)}
.hero .pic label{font-size:12px;font-weight:600;cursor:pointer;color:var(--h-ink);opacity:.8}
.hero .pic label:hover{opacity:1;text-decoration:underline}
.hero .addpic{width:128px;height:128px;border-radius:50%;border:2px dashed var(--h-line);display:grid;place-items:center;text-align:center;font-weight:600;font-size:13px;color:var(--h-ink);cursor:pointer;background:#ffffff22;padding:12px}
@media (max-width:640px){.hero .art{opacity:.45}.hero{padding:20px 18px;gap:14px;align-items:flex-start}.hero .pic .ava,.hero .addpic{width:76px;height:76px}.hero .addpic{font-size:11px;padding:6px}.hero .ico{width:46px;height:42px}.hero>.ico{display:none}}

.profile textarea{width:100%;min-height:150px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}

/* stats */
.mform{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:right;padding:8px 12px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
th:first-child,td:first-child{text-align:left}
.up{color:var(--ok);font-size:12px} .down{color:var(--bad);font-size:12px}
.advice{white-space:pre-wrap;font-size:14.5px;overflow-wrap:anywhere}

/* fab + sheet */
.fab{font-family:var(--f-body);position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;
  border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:14px 20px;font-size:15px;cursor:pointer;box-shadow:0 6px 20px rgba(20,30,60,.25);display:flex;gap:8px;align-items:center}
.fab b{font-size:20px;line-height:1}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,16,15,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--surface);border-radius:20px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.sheet .f{display:flex;flex-direction:column;gap:4px}
.sheet .f>span{font-size:13px;font-weight:600;color:var(--muted)}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet textarea{min-height:180px;resize:vertical}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.sheet .acts .sp{flex:1}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:92%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sheet .row2{grid-template-columns:1fr}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const CLIENTS=[
  {id:'ulyana',name:'Ульяна Павлова',short:'Ульяна',desc:'Предприниматель, учредитель трёх школ'},
  {id:'school',name:'Школа российская онлайн',short:'Школа онлайн',desc:'Онлайн-школа'},
  {id:'natalia',name:'Наталья Перепелица',short:'Наталья',desc:'Врач превентивной медицины, косметолог, генетик'},
  {id:'keystone',name:'Keystone',short:'Keystone',desc:'Агентство элитной недвижимости'},
  {id:'roombloom',name:'Roombloom',short:'Roombloom',desc:'Доступное жильё'},
];
const ICONS={
  ulyana:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z"/><path d="M5 21h14"/>',
  school:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/>',
  natalia:'<path d="M7 2c0 5 10 5 10 10S7 17 7 22"/><path d="M17 2c0 5-10 5-10 10s10 5 10 10"/><path d="M8.6 5.5h6.8M10 8.5h4M10 15.5h4M8.6 18.5h6.8"/>',
  keystone:'<path d="M3 5.5h18v5.2H3zM12 10.7 21 18.5H3z" fill="currentColor" stroke="none"/>',
  roombloom:'<path d="M3.5 11V6a3 3 0 0 1 6 0v5z"/><path d="M6.5 3v8M3.5 7h6"/><path d="M2.5 11.5l1.8 5h3.2M4.3 16.5V21M7.5 16.5V21"/><path d="M9.5 15h12M11 15v6M20 15v6"/><path d="M15 15l.7-3h4.3l-.7 3"/><path d="M15 7.5h5.5M16 7.5V4.5M17.3 7.5V4.5M18.6 7.5l1-2.8"/>',
  inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/>'};
const ICON_INK={school:'#2ff0d2'};
const ico=(id,cls='')=>`<span class="ico ${cls}" style="${cc(id)}${ICON_INK[id]?';color:'+ICON_INK[id]:''}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]||ICONS.inbox}</svg></span>`;
const photo=id=>S.profiles[id]?.photo||'';
const ava=(id,label='')=>{const p=S.profiles[id]||{};return `<span class="ava" role="img" aria-label="${esc(label)}" style="${cc(id)};background-image:url('${esc(p.photo)}');background-size:${(p.zoom||1)*100}%;background-position:${esc(p.pos||'50% 30%')}"></span>`};
const avatarOrIco=id=>photo(id)?ava(id):ico(id);
/* hero themes: each client's header is its own banner, deliberately fixed colors (works on both page themes) */
const HERO={
  ulyana:{bg:'radial-gradient(90% 120% at 70% 0%,#4a3524 0%,#241a14 45%,#140f0c 100%)',ink:'#f6ecdd',sub:'#d8bf95',line:'#e0b878',tile:'#c99a5b',tileInk:'#1a130e',art:'bokeh'},
  school:{bg:'radial-gradient(120% 150% at 85% 10%,#3a63ff 0%,#0b36f2 50%,#0626c2 100%)',ink:'#ffffff',sub:'#c9f5ee',line:'#ffffff',tile:'#2ff0d2',tileInk:'#0b36f2',art:'bubbles'},
  natalia:{bg:'radial-gradient(120% 140% at 80% 20%,#bfe2ff 0%,#8cc6f4 40%,#5fa6e6 100%)',ink:'#0b2f6b',sub:'#1d4a8a',line:'#ffffffd9',tile:'#ffffff',tileInk:'#1f6fc4',art:'dna'},
  keystone:{bg:'linear-gradient(180deg,#ffffff 0%,#f4f4f2 100%)',ink:'#111111',sub:'#6b6b6b',line:'#111111',tile:'transparent',tileInk:'#111111',art:'mark',cls:'hero-min'},
  roombloom:{bg:'linear-gradient(160deg,#9be4d7 0%,#8edccf 60%,#7fd3c4 100%)',ink:'#1e2626',sub:'#2c4642',line:'#1e2626',tile:'transparent',tileInk:'#1e2626',art:'room',cls:'hero-min hero-rb',title:'Room & Bloom',subtitle:'Rent & Sale · доступное жильё'}};
function dnaArt(){
  const W=260,H=200,pts=[];let a='',b='',rungs='';
  for(let i=0;i<=40;i++){const y=i*H/40,x1=W/2+70*Math.sin(i/40*Math.PI*3),x2=W/2-70*Math.sin(i/40*Math.PI*3);
    a+=(i?'L':'M')+x1.toFixed(1)+' '+y.toFixed(1);b+=(i?'L':'M')+x2.toFixed(1)+' '+y.toFixed(1);
    if(i%2===0)rungs+=`<line x1="${x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y.toFixed(1)}" stroke-width="1.2" opacity=".55"/><circle cx="${x1.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="currentColor" stroke="none"/><circle cx="${x2.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="currentColor" stroke="none"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}" style="right:-20px;top:-10px;height:120%;width:auto" fill="none" stroke="currentColor" stroke-width="2.2"><path d="${a}"/><path d="${b}"/>${rungs}</svg>`;
}
function hexArt(id,big){
  const hx=(x,y,r,inner)=>{const p=[0,1,2,3,4,5].map(k=>{const t=Math.PI/3*k;return (x+r*Math.cos(t)).toFixed(1)+','+(y+r*Math.sin(t)).toFixed(1)}).join(' ');
    return `<polygon points="${p}" stroke-width="1.4"/>${inner?`<g transform="translate(${x-r*.42} ${y-r*.42}) scale(${r*.84/24})" stroke-width="${2.2*24/(r*.84)}">${inner}</g>`:''}`};
  const extra=id==='natalia'?[
    hx(40,40,30,'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M6 12h3l1.5-2 2 4 1.5-2h4"/>'),
    hx(120,95,26,'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>'),
    hx(45,150,26,'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M12 9v6M9 12h6"/>')].join('')
    :[hx(30,30,26,ICONS[id]),hx(80,110,20,''),hx(150,40,16,'')].join('');
  return `<svg viewBox="0 0 200 200" style="${id==='natalia'?'right:150px;top:-6px;height:115%;opacity:.85':'right:-10px;top:-20px;height:140%;opacity:.7'};width:auto" fill="none" stroke="currentColor">${extra}</svg>`;
}
function bubbleArt(){
  return `<svg viewBox="0 0 200 120" style="right:150px;top:8px;height:85%;width:auto"><g fill="currentColor"><circle cx="40" cy="30" r="19"/><circle cx="96" cy="52" r="14"/><circle cx="52" cy="92" r="10"/></g></svg>`;
}
function markArt(){
  return `<svg viewBox="0 0 24 24" style="right:40px;top:50%;transform:translateY(-50%);height:70%;width:auto;opacity:.06"><path d="M3 5.5h18v5.2H3zM12 10.7 21 18.5H3z" fill="currentColor"/></svg>`;
}
function roomArt(){
  return `<svg viewBox="0 0 24 24" style="right:30px;top:50%;transform:translateY(-50%);height:82%;width:auto;opacity:.16" fill="none" stroke="currentColor" stroke-width=".7" stroke-linecap="round" stroke-linejoin="round">${ICONS.roombloom}</svg>`;
}
function bokehArt(){
  const dots=[[300,30,26,.35],[360,70,16,.5],[250,90,12,.4],[420,25,10,.6],[200,40,8,.35],[470,95,20,.25],[150,110,14,.2],[520,40,12,.45]];
  return `<svg viewBox="0 0 600 160" preserveAspectRatio="xMaxYMid slice" style="inset:0;width:100%;height:100%"><defs><filter id="bk"><feGaussianBlur stdDeviation="4"/></filter></defs>
    <g filter="url(#bk)">${dots.map(([x,y,r,o])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#f2c27a" opacity="${o}"/>`).join('')}</g>
    <path d="M330 -10 L560 120" stroke="#ffffff" stroke-opacity=".08" stroke-width="22"/></svg>`;
}
function hero(cid){
  const c=byId(cid),h=HERO[cid],ph=photo(cid);
  const art=h.art==='dna'?dnaArt()+hexArt(cid):h.art==='bubbles'?bubbleArt():h.art==='mark'?markArt():h.art==='room'?roomArt():h.art==='bokeh'?bokehArt():hexArt(cid);
  const pic=ph?`<div class="pic">${ava(cid,c.name)}${assets?`<label for="ph-${cid}">Сменить фото</label>`:''}</div>`
    :assets?`<div class="pic"><label class="addpic" for="ph-${cid}">+ Добавить фото</label></div>`:'';
  return `<div class="hero ${h.cls||''}" style="--h-bg:${h.bg};--h-ink:${h.ink};--h-sub:${h.sub};--h-line:${h.line};--h-tile:${h.tile};--h-tile-ink:${h.tileInk}">
    <div class="art">${art}</div>
    ${ico(cid)}
    <div class="txt"><h1>${esc(h.title||c.name)}</h1><div class="sub">${esc(h.subtitle||c.desc)}</div><div class="rule"><i></i><b></b><i></i></div></div>
    ${pic}<input type="file" accept="image/jpeg,image/png,image/webp" id="ph-${cid}" data-photo="${cid}" hidden>
  </div>`;
}
const INBOX={id:'inbox',name:'Входящие',short:'Входящие',desc:'Быстрые мысли, разобрать в понедельник'};
const ALL=[...CLIENTS,INBOX];
const byId=id=>ALL.find(c=>c.id===id)||INBOX;
const KINDS={task:'Задача',post:'Пост в контент-план',idea:'Идея',text:'Текст',rubric:'Рубрика',chat:'Чат GPT',link:'Ссылка',note:'Заметка'};
const LINK_CATS={video:'Видео и исходники',docs:'Документы и таблицы',access:'Доступы и кабинеты',refs:'Референсы и вдохновение',other:'Другое'};
const SERVICES=[[/disk\.yandex|yadi\.sk/,'Яндекс Диск'],[/drive\.google|docs\.google/,'Google Drive'],[/cloud\.mail\.ru/,'Облако Mail'],[/dropbox/,'Dropbox'],[/icloud/,'iCloud'],[/figma/,'Figma'],[/canva/,'Canva'],[/notion/,'Notion'],[/t\.me|telegram/,'Telegram'],[/youtu/,'YouTube'],[/instagram/,'Instagram'],[/pinterest/,'Pinterest'],[/chatgpt|openai/,'ChatGPT']];
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
const service=u=>{const h=host(u);const m=SERVICES.find(([r])=>r.test(h));return m?m[1]:h};
const normUrl=u=>{u=(u||'').trim();if(!u)return '';return /^[a-z][a-z0-9+.-]*:\/\//i.test(u)?u:'https://'+u.replace(/^\/+/,'')};
const STATUS={
  post:{todo:'Запланирован',doing:'В работе',done:'Опубликован'},
  def:{todo:'Надо сделать',doing:'В работе',done:'Готово'}};
const stLabel=(it)=>(it.kind==='post'?STATUS.post:STATUS.def)[it.status||'todo'];
const TABS=[['overview','Обзор'],['tasks','Задачи'],['plan','Контент-план'],['ideas','Идеи и тексты'],['carousels','Карусели'],['rubrics','Рубрики'],['chats','Чаты GPT'],['links','Ссылки'],['notes','Заметки'],['stats','Аналитика']];
const TAB_KIND={tasks:'task',plan:'post',ideas:'idea',carousels:'idea',rubrics:'rubric',chats:'chat',links:'link',notes:'note',stats:'note',overview:'task'};

/* dates */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DOW=['пн','вт','ср','чт','пт','сб','вс'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONTH=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const todayISO=()=>iso(new Date());
const dShort=s=>{const d=parse(s);return `${d.getDate()} ${MONS[d.getMonth()]}, ${DOW[(d.getDay()+6)%7]}`};
const range=(a,b)=>a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MON[b.getMonth()]}`:`${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cc=id=>`--cc:var(--c-${byId(id).id})`;

/* ---------- store ---------- */
const S={items:[],metrics:[],advice:{},profiles:{},ready:false,live:false};
let db=null,assets=null;
const LS='smm-pult-local';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'{}');Object.assign(S,{items:j.items||[],metrics:j.metrics||[],advice:j.advice||{},profiles:j.profiles||{}})}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({items:S.items,metrics:S.metrics,advice:S.advice,profiles:S.profiles}))}catch(e){}}
const toMap=snap=>Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));
async function initStore(){
  try{db=window.claude?.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){loadLocal();S.ready=true;render();return}
  S.live=true;
  window.claude.use('assets').then(a=>{assets=a;render()}).catch(()=>{});
  window.claude.use('downloads').then(d=>{downloadsNS=d}).catch(()=>{});
  const fail=e=>toast(e?.code==='revoked'?'Доступ к данным закрыт':'Не удалось загрузить данные. Обновите страницу.');
  db.collection('items').onSnapshot(s=>{S.items=s.docs.map(d=>({...d.data(),id:d.id}));S.ready=true;render()},fail);
  db.collection('metrics').onSnapshot(s=>{S.metrics=s.docs.map(d=>({...d.data(),id:d.id}));render()},fail);
  db.collection('advice').onSnapshot(s=>{S.advice=toMap(s);render()},fail);
  db.collection('profiles').onSnapshot(s=>{S.profiles=toMap(s);render()},fail);
}
async function write(col,id,body){
  if(S.live){
    try{await db.collection(col).doc(id).set(body)}
    catch(e){toast(e?.code==='quota_exceeded'?'Место в базе закончилось: удалите старые записи':'Не сохранилось, попробуйте ещё раз');throw e}
  }else{
    if(col==='items'||col==='metrics'){const arr=S[col];const i=arr.findIndex(x=>x.id===id);const v={...body,id};i<0?arr.push(v):arr[i]=v}
    else S[col][id]=body;
    saveLocal();render();
  }
}
async function remove(col,id){
  if(S.live){try{await db.collection(col).doc(id).delete()}catch(e){toast('Не удалилось, попробуйте ещё раз')}}
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render()}
}
const saveItem=it=>{const {id,...b}=it;b.updatedAt=Date.now();return write('items',id,b)};

/* ---------- ui state ---------- */
const PLATFORMS={
  ig:{name:'Instagram',short:'IG',formats:['Reels','Пост','Карусель','Сторис']},
  yt:{name:'YouTube',short:'YT',formats:['Shorts','Длинное видео']},
  tg:{name:'Telegram',short:'TG',formats:['Пост','Статья']},
  th:{name:'Threads',short:'Threads',formats:['Пост']}};
const FMT_SHORT={'Длинное видео':'Видео'};
const platLabel=it=>it.platform&&PLATFORMS[it.platform]?`<span class="plat plat-${it.platform}" title="${esc(platText(it))}">${PLATFORMS[it.platform].short}${it.format?' · '+esc(FMT_SHORT[it.format]||it.format):''}</span>`:'';
const platText=it=>it.platform&&PLATFORMS[it.platform]?PLATFORMS[it.platform].name+(it.format?' '+it.format:''):'';
const U={view:'week',tab:'overview',weekOff:0,planMode:'week',planOff:0,filter:new Set(CLIENTS.map(c=>c.id)),pfilter:new Set([...Object.keys(PLATFORMS),'none']),busy:{}};
try{const v=JSON.parse(localStorage.getItem('smm-pult-ui')||'{}');if(v.view)U.view=v.view;if(v.tab)U.tab=v.tab;if(v.planMode)U.planMode=v.planMode}catch(e){}
const remember=()=>{try{localStorage.setItem('smm-pult-ui',JSON.stringify({view:U.view,tab:U.tab,planMode:U.planMode}))}catch(e){}};

const items=(f)=>S.items.filter(f);
const openTasks=cid=>items(i=>i.client===cid&&i.kind==='task'&&i.status!=='done');
const sortTasks=a=>a.sort((x,y)=>(x.date||'9')<(y.date||'9')?-1:(x.date||'9')>(y.date||'9')?1:(y.createdAt||0)-(x.createdAt||0));

/* ---------- render ---------- */
let raf=0;
function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint()})}
function paint(){
  const a=document.activeElement, keep=a&&a.id?{id:a.id,v:a.value,s:a.selectionStart,e:a.selectionEnd}:null;
  document.getElementById('rail').innerHTML=rail();
  if(paint.last!==U.view){paint.last=U.view;const cur=document.querySelector('.nav[aria-current="true"]');if(cur&&innerWidth<=860)try{cur.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
  const v=document.getElementById('view');
  v.innerHTML=U.view==='week'?viewWeek():U.view==='plan'?viewPlanPage():viewClient(U.view);
  if(v.querySelector('img[data-thumb]'))fillThumbs();
  if(paint.lastTab!==U.view+U.tab){paint.lastTab=U.view+U.tab;const st=v.querySelector('.seg [aria-selected="true"]');if(st)try{st.parentElement.scrollLeft=st.offsetLeft-st.parentElement.clientWidth/2+st.clientWidth/2}catch(e){}}
  if(keep){const el=document.getElementById(keep.id);if(el){if(el.value!==undefined&&!el.dataset.fresh)el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}

function rail(){
  const n=(id,label,extra='',cur)=>`<button class="nav" data-go="${id}" aria-current="${U.view===id}" style="${extra}">${label}</button>`;
  const inboxN=items(i=>i.client==='inbox'&&i.status!=='done').length;
  return `<div class="brand">SMM-пульт<small>${dShort(todayISO())}</small></div>`+
    n('week','<span class="glyph"></span>Неделя')+
    n('plan','<span class="glyph" style="border-radius:50%"></span>Контент-план')+
    `<div class="rail-label">Клиенты</div>`+
    CLIENTS.map(c=>n(c.id,`${ico(c.id)}${esc(c.short)}<span class="cnt">${openTasks(c.id).length||''}</span>`,cc(c.id))).join('')+
    `<div class="rail-label">Разобрать</div>`+
    n('inbox',`${ico('inbox')}Входящие<span class="cnt">${inboxN||''}</span>`,cc('inbox'));
}

function rowItem(it,{showClient=false}={}){
  const late=it.date&&it.date<todayISO()&&it.status!=='done'&&(it.kind==='task'||it.kind==='post');
  const canCheck=it.kind==='task'||it.kind==='post';
  return `<div class="row ${it.status==='done'?'done':''}">
    ${canCheck?`<input type="checkbox" class="chk" data-check="${it.id}" ${it.status==='done'?'checked':''} aria-label="Готово">`:`<span class="dot" style="${cc(it.client)};margin-top:7px"></span>`}
    <div class="body" data-edit="${it.id}">
      <div class="t">${esc(it.title||'Без названия')}</div>
      <div class="meta">
        ${showClient?`<span class="tag" style="${cc(it.client)}"><span class="dot"></span>${esc(byId(it.client).short)}</span>`:''}
        ${it.kind!=='task'?`<span>${esc(KINDS[it.kind]||'')}</span>`:''}
        ${it.date?`<span class="${late?'tag late':''}">${late?'просрочено · ':''}${dShort(it.date)}</span>`:''}
        ${it.status==='doing'?`<span class="st-doing">В работе</span>`:''}
        ${platLabel(it)}${it.rubric?`<span>#${esc(it.rubric)}</span>`:''}
        ${it.by==='claude'?`<span class="tag claude">от Claude</span>`:''}
        ${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" data-stop>открыть ссылку ↗</a>`:''}
      </div>
      ${it.body&&it.kind!=='task'?`<div class="clip">${esc(it.body)}</div>`:''}
    </div></div>`;
}
const linkRow=it=>`<div class="row"><span class="svc" title="${esc(host(it.url))}">${esc(service(it.url)||'Ссылка')}</span>
  <div class="body" data-edit="${it.id}"><div class="t">${esc(it.title||host(it.url)||'Без названия')}</div><div class="meta"><span>${esc(host(it.url))}</span>${it.body?`<span>${esc(it.body.slice(0,120))}</span>`:''}</div></div>
  <div class="lacts">${it.url?`<a class="btn sm" href="${esc(it.url)}" target="_blank" rel="noopener" data-stop>Открыть ↗</a><button class="btn sm ghost" type="button" data-copyurl="${it.id}">Копировать</button>`:''}</div></div>`;
const list=(arr,opt,emptyText)=>arr.length?`<div class="list">${arr.map(i=>rowItem(i,opt)).join('')}</div>`:`<div class="empty">${emptyText}</div>`;

/* ----- week ----- */
function viewWeek(){
  const mon=addDays(monday(new Date()),U.weekOff*7), sun=addDays(mon,6), mISO=iso(mon), sISO=iso(sun), t=todayISO();
  const isCur=U.weekOff===0;
  const today=sortTasks(items(i=>(i.kind==='task'||i.kind==='post')&&i.status!=='done'&&i.date&&i.date<=t&&i.client!=='inbox'));
  const ideas=items(i=>i.by==='claude'&&i.week===mISO&&i.kind==='idea');
  const inbox=items(i=>i.client==='inbox').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const cards=CLIENTS.map(c=>{
    const ot=sortTasks(openTasks(c.id));
    const posts=items(i=>i.client===c.id&&i.kind==='post'&&i.date>=mISO&&i.date<=sISO);
    const wk=ot.filter(i=>!i.date||i.date<=sISO).slice(0,4);
    return `<div class="card cc" style="${cc(c.id)}">
      <div class="cc-top">${avatarOrIco(c.id)}<div><h3>${esc(c.name)}</h3><div class="desc">${esc(c.desc)}</div></div></div>
      <div class="nums"><div><b>${ot.length}</b><span>задач открыто</span></div><div><b>${posts.filter(p=>p.status==='done').length}/${posts.length}</b><span>постов за неделю</span></div></div>
      <div class="mini">${wk.length?wk.map(i=>`<label><input type="checkbox" class="chk" data-check="${i.id}"><span>${esc(i.title)}${i.date?` <span class="mono" style="color:var(--muted)">${dShort(i.date)}</span>`:''}</span></label>`).join(''):`<span style="color:var(--muted);font-size:14px">Задач на неделю нет</span>`}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto"><button class="btn sm solid" data-go="${c.id}">Открыть</button><button class="btn sm ghost" data-new="task" data-client="${c.id}">+ задача</button></div>
    </div>`}).join('');
  const ideasBy=CLIENTS.map(c=>{const a=ideas.filter(i=>i.client===c.id);return a.length?`<div class="card" style="${cc(c.id)};display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--cc)"><b>${esc(c.name)}</b>${a.map(i=>`<div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1;min-width:0;cursor:pointer" data-edit="${i.id}"><div style="font-weight:600">${esc(i.title)}</div>${i.body?`<div class="clip">${esc(i.body)}</div>`:''}</div><button class="btn sm" data-toplan="${i.id}">В план</button></div>`).join('')}</div>`:''}).join('');
  return `<div class="head"><div class="grow"><h1>Неделя ${range(mon,sun)}</h1><div class="sub">${isCur?'Текущая неделя':U.weekOff<0?'Прошедшая неделя':'Следующая неделя'} · 5 клиентов</div></div>
      <div style="display:flex;gap:6px"><button class="btn sm" data-week="-1" aria-label="Прошлая неделя">←</button>${isCur?'':`<button class="btn sm" data-week="0">Сейчас</button>`}<button class="btn sm" data-week="1" aria-label="Следующая неделя">→</button></div></div>
    ${S.live||!S.ready?'':`<div class="banner">Сейчас записи хранятся только в этом браузере. Откройте страницу в приложении Claude, чтобы они синхронизировались между телефоном и компьютером.</div>`}
    <section><div class="sec-h"><h2>Быстро записать мысль</h2><span class="hint">Улетит во «Входящие» или сразу клиенту</span></div>

    <section><div class="sec-h"><h2>Идеи Claude на эту неделю</h2><span class="hint">приходят по понедельникам утром</span></div>${ideasBy?`<div class="grid">${ideasBy}</div>`:`<div class="empty">Каждый понедельник утром здесь будут появляться идеи публикаций для каждого клиента. Хорошая идея ставится в контент-план одной кнопкой.</div>`}</section>

/* ----- content plan ----- */
function planBlock(clientId){
  const ids=clientId?[clientId]:[...U.filter];
  const posts=items(i=>i.kind==='post'&&i.date&&ids.includes(i.client)&&U.pfilter.has(PLATFORMS[i.platform]?i.platform:'none'));
  const t=todayISO();
  const card=p=>`<button class="post ${p.status==='done'?'done':''}" style="${cc(p.client)}" data-edit="${p.id}">${platLabel(p)}<span class="pt">${esc(p.title||'Без названия')}</span><span class="pm">${clientId?'':esc(byId(p.client).short)+' · '}${stLabel(p)}${p.rubric?' · #'+esc(p.rubric):''}</span></button>`;
  let body,label;
  if(U.planMode==='week'){
    const mon=addDays(monday(new Date()),U.planOff*7);label=range(mon,addDays(mon,6));
    body=`<div class="week">${[0,1,2,3,4,5,6].map(k=>{const d=iso(addDays(mon,k));const ps=posts.filter(p=>p.date===d);
      return `<div class="day ${d===t?'today':''}"><div class="day-h"><b>${parse(d).getDate()}</b><span>${DOW[k]}</span></div>${ps.map(card).join('')}<button class="add-day" data-new="post" data-date="${d}" data-client="${clientId||''}">+ пост</button></div>`}).join('')}</div>`;
  }else{
    const now=new Date();const m=new Date(now.getFullYear(),now.getMonth()+U.planOff,1);const e=new Date(m.getFullYear(),m.getMonth()+1,0);
    label=`${MONTH[m.getMonth()]} ${m.getFullYear()}`;
    const ps=posts.filter(p=>p.date>=iso(m)&&p.date<=iso(e)).sort((a,b)=>a.date<b.date?-1:1);
    const days=[...new Set(ps.map(p=>p.date))];
    body=days.length?`<div class="agenda">${days.map(d=>`<div class="ad"><div class="ad-d">${parse(d).getDate()} ${MONS[parse(d).getMonth()]}<span>${DOW[(parse(d).getDay()+6)%7]}${d===t?' · сегодня':''}</span></div><div class="ad-p">${ps.filter(p=>p.date===d).map(card).join('')}</div></div>`).join('')}</div>`
      :`<div class="empty">В этом месяце постов пока нет. Добавьте первый кнопкой «Записать» или через недельный вид.</div>`;
  }
  return `<div class="plan-bar"><div class="toggle"><button data-pmode="week" aria-pressed="${U.planMode==='week'}">Неделя</button><button data-pmode="month" aria-pressed="${U.planMode==='month'}">Месяц</button></div>
    <button class="btn sm" data-poff="-1" aria-label="Назад">←</button><button class="btn sm" data-poff="0">Сегодня</button><button class="btn sm" data-poff="1" aria-label="Вперёд">→</button>
    <span class="range">${label}</span></div>
    <div class="filters">${Object.entries(PLATFORMS).map(([k,v])=>`<button class="fchip" data-pfilter="${k}" aria-pressed="${U.pfilter.has(k)}"><span class="plat plat-${k}">${v.short}</span>${v.name}</button>`).join('')}<button class="fchip" data-pfilter="none" aria-pressed="${U.pfilter.has('none')}">Без площадки</button></div>
    ${clientId?'':`<div class="filters">${CLIENTS.map(c=>`<button class="fchip" style="${cc(c.id)}" data-filter="${c.id}" aria-pressed="${U.filter.has(c.id)}"><span class="dot"></span>${esc(c.short)}</button>`).join('')}</div>`}
    ${body}`;
}
function viewPlanPage(){
  return `<div class="head"><div class="grow"><h1>Контент-план</h1><div class="sub">Все клиенты на одном экране. Нажмите на клиента, чтобы скрыть или показать.</div></div></div><section>${planBlock(null)}</section>`;
}

  if(cid==='inbox'){

      <section><div class="sec-h"><h2>Открытые задачи</h2>${newBtn('task','задача')}</div>${list(ot,{},'Задач нет.')}</section>

        ${adv?`<div class="card"><div class="sec-h" style="margin-bottom:6px"><h2>Последний разбор Claude</h2><span class="hint">${new Date(adv.at).toLocaleDateString('ru-RU')}</span></div><div class="clip" style="-webkit-line-clamp:6">${esc(adv.text)}</div><button class="btn sm ghost" data-tab="stats">Весь разбор →</button></div>`:''}</section>

  case 'plan': return `<section>${planBlock(cid)}</section>`;
  case 'ideas':{
    const a=items(i=>i.client===cid&&(i.kind==='idea'||i.kind==='text')).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
    return `<section><div class="sec-h"><h2>Идеи и тексты</h2><span class="hint">черновики, заготовки постов, всё, что придумали</span><span class="sp"></span>
      <button class="btn sm" data-genideas="${cid}" ${U.busy['g'+cid]?'disabled':''}>${U.busy['g'+cid]?'Claude думает…':'Придумать 5 идей с Claude'}</button><button class="btn sm primary" data-new="idea" data-client="${cid}">+ идея</button><button class="btn sm primary" data-new="text" data-client="${cid}">+ текст</button></div>
      ${a.length?`<div class="list">${a.map(i=>rowItem(i).replace('</div></div>',`</div>${i.kind==='idea'?`<button class="btn sm" data-toplan="${i.id}">В план</button>`:''}</div>`)).join('')}</div>`:`<div class="empty">Сюда складываются идеи и готовые тексты. Нажмите «+ текст» и вставьте черновик целиком, его можно скопировать отсюда в один клик.</div>`}</section>`;}

    const groups=Object.entries(LINK_CATS).map(([k,l])=>[l,a.filter(i=>(LINK_CATS[i.cat]?i.cat:'other')===k)]).filter(([,x])=>x.length);

  }
  return '';
}

/* ----- analytics ----- */
const MF=[['followers','Подписчики'],['reach','Охват за неделю'],['views','Просмотры'],['er','Вовлечённость, %'],['leads','Заявки / сообщения']];
function statsTab(cid){
  const mon=iso(monday(new Date()));
  const ms=S.metrics.filter(m=>m.client===cid).sort((a,b)=>a.week<b.week?1:-1);
  const cur=ms.find(m=>m.week===mon)||{};
  const adv=S.advice[cid];
  const delta=(a,b)=>{if(a==null||b==null||a===''||b==='')return '';const d=Number(a)-Number(b);if(!isFinite(d)||d===0)return '';return ` <span class="${d>0?'up':'down'}">${d>0?'▲':'▼'}${Math.abs(Math.round(d*10)/10).toLocaleString('ru-RU')}</span>`};
  const fmt=v=>v===''||v==null?'—':Number(v).toLocaleString('ru-RU');

function context(cid){

  const posts=items(i=>i.client===cid&&i.kind==='post'&&i.date>=since).sort((a,b)=>a.date<b.date?-1:1);

  const done=items(i=>i.client===cid&&i.kind==='task'&&i.status==='done'&&(i.updatedAt||0)>Date.now()-14*864e5).map(i=>i.title);
  return `Клиент: ${c.name} — ${c.desc}.
О клиенте: ${(p.about||'нет данных').slice(0,2500)}
Рубрики: ${rub.join(', ')||'не заданы'}
Метрики по неделям (старые → новые):
${ms.map(m=>`${m.week}: ${MF.map(([k,l])=>`${l}=${m[k]??'—'}`).join('; ')}${m.note?'; заметка: '+m.note:''}`).join('\n')||'нет данных'}

${posts.map(p=>`${p.date} [${stLabel(p)}] ${platText(p)?platText(p)+' ':''}${p.rubric?'#'+p.rubric+' ':''}${p.title}`).join('\n')||'нет'}

const CW=1080,CH=1350;
const imgCache={};
const loadImg=url=>!url?Promise.resolve(null):imgCache[url]||(imgCache[url]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=url}));
let fontsP=null;
const ensureFonts=()=>fontsP||(fontsP=Promise.all(['300','400','500','600','700','800'].flatMap(w=>[document.fonts.load(`${w} 40px Montserrat`),document.fonts.load(`${w} 40px Manrope`)])).catch(()=>{}));
const setFont=(ctx,w,size)=>{ctx.font=`${w} ${size}px Montserrat, system-ui, sans-serif`};
function spacedW(ctx,s,sp){if(!sp)return ctx.measureText(s).width;let w=0;for(const ch of s)w+=ctx.measureText(ch).width+sp;return s.length?w-sp:0}
function drawSpaced(ctx,s,x,y,sp,align){const w=spacedW(ctx,s,sp);let cx=align==='center'?x-w/2:align==='right'?x-w:x;if(!sp){ctx.fillText(s,cx,y);return}for(const ch of s){ctx.fillText(ch,cx,y);cx+=ctx.measureText(ch).width+sp}}
function wrap(ctx,text,maxW,sp=0){
  const out=[];
  for(const para of String(text||'').split('\n')){
    const words=para.split(/\s+/).filter(Boolean);if(!words.length){out.push('');continue}
    let line='';for(const w of words){const t=line?line+' '+w:w;if(!line||spacedW(ctx,t,sp)<=maxW)line=t;else{out.push(line);line=w}}out.push(line);
  }
  return out;
}
function block(ctx,text,x,y,maxW,lh,{sp=0,max=99,align='left',upper=false}={}){
  if(upper)text=String(text||'').toUpperCase();
  let lines=wrap(ctx,text,maxW,sp);
  if(lines.length>max){lines=lines.slice(0,max);lines[max-1]=lines[max-1].replace(/\s*\S*$/,'')+'…'}
  lines.forEach((l,i)=>drawSpaced(ctx,l,x,y+i*lh,sp,align));
  return lines.length*lh;
}
/* pick the largest size from `sizes` at which the text fits in `max` lines */
function fit(ctx,text,weight,sizes,maxW,max,spK=0,upper=false){
  if(upper)text=String(text||'').toUpperCase();
  for(const s of sizes){setFont(ctx,weight,s);if(wrap(ctx,text,maxW,s*spK).length<=max)return s}
  return sizes[sizes.length-1];
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function photoIn(ctx,img,x,y,w,h,{zoom=1,pos='50% 30%',circle=false,r=0}={}){
  if(!img)return;

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-cs],[data-car],[data-newcar],[data-mkcar]');if(!b)return;
  if(b.dataset.car){const it=S.items.find(x=>x.id===b.dataset.car);if(it)openStudio(it);return}
  if(b.dataset.newcar){newCarousel(b.dataset.newcar,b.dataset.style?{style:b.dataset.style}:{});return}
  if(b.dataset.mkcar!==undefined){
    readEditor();const post={...editing};if(!post.title){document.getElementById('ed-title').focus();return}
    closeEditor();await saveItem(post);
    const ex=S.items.find(x=>x.kind==='carousel'&&x.postId===post.id);
    ex?openStudio(ex):newCarousel(post.client,{title:post.title,postId:post.id});return;
  }
  if(!studio)return;const a=b.dataset.cs,i=+b.dataset.i,sl=studio.it.slides;
  if(a==='close')closeStudio();
  else if(a==='save')saveStudio();
  else if(a==='ai')studioAI();
  else if(a==='add'){const isCase=studio.it.style==='case';sl.splice(Math.max(1,sl.length-1),0,isCase?{bg:'light',tag:'Новый слайд',h:'Заголовок с *акцентом*',t:'- пункт\n- пункт',note:''}:{h:'Новая мысль',t:''});studio.dirty=true;drawStudio()}
  else if(a==='rm'){sl.splice(i,1);studio.dirty=true;drawStudio()}
  else if(a==='nophoto'){delete sl[i].photo;studio.dirty=true;drawStudio()}
  else if(a==='up'&&i>0){[sl[i-1],sl[i]]=[sl[i],sl[i-1]];studio.dirty=true;drawStudio()}
  else if(a==='down'&&i<sl.length-1){[sl[i+1],sl[i]]=[sl[i],sl[i+1]];studio.dirty=true;drawStudio()}
  else if(a==='del'){if(!studio.confirmDel){studio.confirmDel=true;drawStudio()}else{const id=studio.it.id;studio=null;document.getElementById('overlay').hidden=true;await remove('items',id);toast('Карусель удалена')}}
  else if(a==='png'){const c=document.getElementById('cs-c-'+i);try{await saveFile(`${slug(studio.it.title)}-${i+1}.png`,await canvasBlob(c))}catch(err){toast('Не получилось подготовить картинку')}}
  else if(a==='zip'){
    if(typeof JSZip==='undefined'){toast('Архиватор не загрузился, скачайте слайды по одному');return}
    try{const z=new JSZip();for(let k=0;k<sl.length;k++){const c=document.getElementById('cs-c-'+k);z.file(`${String(k+1).padStart(2,'0')}.png`,await canvasBlob(c))}
      await saveFile(`${slug(studio.it.title)}.zip`,await z.generateAsync({type:'blob'}))}catch(err){toast('Не получилось подготовить архив')}
  }
});

render();
initStore();
</script>
